# Path-scoped ignores for intentional workflow_run without a workflows: name filter.
# GitHub accepts omitting workflows: (match any completed workflow); actionlint still requires it.
# Runtime gates: conclusion == failure, associated PRs, dashboard off-by-default.
paths:
  .github/workflows/trigger-obs-aw-workflow-run.yml:
    ignore:
      - 'no workflow is configured for "workflow_run" event'
  .github/remote-workflow-template/obs/.github/workflows/trigger-obs-aw-workflow-run.yml:
    ignore:
      - 'no workflow is configured for "workflow_run" event'
