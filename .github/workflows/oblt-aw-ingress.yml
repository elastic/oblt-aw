name: Observability Agentic Workflow Ingress

# Dynamic routing: plan-routes selects eligible workflows; publish-planned-dispatch writes
# oblt-aw-planned-dispatch.yml; invoke-planned-dispatch calls it at a literal @ref.
on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: false
      BUILDKITE_API_TOKEN:
        required: false

permissions:
  actions: write
  checks: read
  contents: write
  discussions: write
  id-token: write
  issues: write
  pull-requests: write

# Keep in sync: publish-planned-dispatch args and invoke-planned-dispatch uses: (literal).
env:
  DISPATCH_REPO: elastic/oblt-aw
  DISPATCH_BRANCH: oblt-aw/dispatch/working
  DISPATCH_WORKFLOW: oblt-aw-planned-dispatch.yml

jobs:
  dashboard-enabled-workflows:
    if: >-
      github.event_name != 'status' ||
      (github.event_name == 'status' && github.event.state == 'failure' && contains(github.event.context, 'buildkite'))
    uses: ./.github/workflows/get-enabled-workflows.yml

  load-allowed-authors:
    if: github.event_name == 'pull_request' || github.event_name == 'issues'
    uses: ./.github/workflows/load-allowed-authors.yml

  plan-routes:
    name: Plan ingress routes
    needs:
      - dashboard-enabled-workflows
      - load-allowed-authors
    if: >-
      always() &&
      (needs.dashboard-enabled-workflows.result == 'success' ||
        needs.dashboard-enabled-workflows.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      routes: ${{ steps.plan.outputs.routes }}
      has-routes: ${{ steps.plan.outputs.has-routes }}
      unsupported-trigger: ${{ steps.plan.outputs.unsupported-trigger }}
    steps:
      - name: Checkout control plane scripts
        uses: actions/checkout@v6
        with:
          repository: elastic/oblt-aw
          ref: ${{ github.repository == 'elastic/oblt-aw' && github.sha || 'main' }}
          path: oblt-aw
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Plan routes for this event
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EFFECTIVE_RAW: ${{ needs.dashboard-enabled-workflows.outputs.effective-raw || '' }}
          ENABLED_WORKFLOWS_JSON: ${{ needs.dashboard-enabled-workflows.outputs.enabled-workflows || '[]' }}
          ALLOWED_PR_AUTHORS_JSON: ${{ needs.load-allowed-authors.outputs.allowed_pr_authors_json || '[]' }}
          ALLOWED_ISSUE_AUTHORS_JSON: ${{ needs.load-allowed-authors.outputs.allowed_issue_authors_json || '[]' }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login || '' }}
          PR_LABELS_CSV: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          ISSUE_LABELS_CSV: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association || '' }}
          STATUS_STATE: ${{ github.event.state || '' }}
          STATUS_CONTEXT: ${{ github.event.context || '' }}
          LABELED_LABEL_NAME: ${{ github.event.label.name || '' }}
        working-directory: oblt-aw
        run: python scripts/plan_ingress_routes.py

  publish-planned-dispatch:
    name: Publish planned dispatch workflow
    needs:
      - dashboard-enabled-workflows
      - plan-routes
    if: >-
      needs.plan-routes.outputs.has-routes == 'true' &&
      (needs.dashboard-enabled-workflows.result == 'success' ||
        needs.dashboard-enabled-workflows.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dispatch_sha: ${{ steps.record-dispatch-sha.outputs.dispatch_sha }}
    concurrency:
      group: oblt-aw-dispatch-working
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Create ephemeral GitHub token for control plane
        id: create-token
        uses: elastic/oblt-actions/github/create-token@v1

      - name: Checkout control plane scripts and config
        uses: actions/checkout@v6
        with:
          repository: elastic/oblt-aw
          ref: main
          path: oblt-aw-tools
          sparse-checkout: |
            scripts
            config
          sparse-checkout-cone-mode: false
          token: ${{ steps.create-token.outputs.token }}

      - name: Checkout control plane repository for dispatch branch
        uses: actions/checkout@v6
        with:
          repository: elastic/oblt-aw
          ref: main
          path: oblt-aw
          fetch-depth: 0
          token: ${{ steps.create-token.outputs.token }}

      - name: Prepare dispatch branch
        working-directory: oblt-aw
        env:
          DISPATCH_BRANCH: ${{ env.DISPATCH_BRANCH }}
        run: |
          set -euo pipefail
          git fetch origin
          remote_ref="origin/${DISPATCH_BRANCH}"
          if git rev-parse --verify "${remote_ref}" >/dev/null 2>&1; then
            git checkout -B "${DISPATCH_BRANCH}" "${remote_ref}"
            echo "checked out existing branch ${DISPATCH_BRANCH} from ${remote_ref}"
          else
            git checkout -B "${DISPATCH_BRANCH}"
            echo "created branch ${DISPATCH_BRANCH} from current HEAD"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Generate planned dispatch workflow
        env:
          ROUTES_JSON: ${{ needs.plan-routes.outputs.routes }}
          CONTROL_PLANE_REF: ${{ github.repository == 'elastic/oblt-aw' && github.sha || 'main' }}
          DISPATCH_REPO: ${{ env.DISPATCH_REPO }}
          DISPATCH_WORKFLOW: ${{ env.DISPATCH_WORKFLOW }}
        run: |
          python oblt-aw-tools/scripts/generate_planned_dispatch.py \
            --routes-json "${ROUTES_JSON}" \
            --control-plane-ref "${CONTROL_PLANE_REF}" \
            --dispatch-repo "${DISPATCH_REPO}" \
            --dispatch-workflow "${DISPATCH_WORKFLOW}" \
            --output "oblt-aw/.github/workflows/${DISPATCH_WORKFLOW}"

      - name: Setup git for control plane commits
        uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ steps.create-token.outputs.token }}

      - name: Commit planned dispatch workflow
        id: commit-dispatch
        working-directory: oblt-aw
        env:
          ROUTES_JSON: ${{ needs.plan-routes.outputs.routes }}
          DISPATCH_WORKFLOW: ${{ env.DISPATCH_WORKFLOW }}
        run: |
          set -euo pipefail
          git add ".github/workflows/${DISPATCH_WORKFLOW}"
          if git diff --cached --quiet; then
            echo "no changes to planned dispatch workflow; skipping commit"
            echo "changes_detected=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          routes_csv="$(printf '%s' "${ROUTES_JSON}" | jq -r 'join(", ")')"
          git commit -m "chore(dispatch): planned routes ${routes_csv}"
          echo "changes_detected=true" >> "${GITHUB_OUTPUT}"

      - name: Push dispatch branch
        if: steps.commit-dispatch.outputs.changes_detected == 'true'
        working-directory: oblt-aw
        env:
          DISPATCH_BRANCH: ${{ env.DISPATCH_BRANCH }}
        run: |
          set -euo pipefail
          refspec="HEAD:refs/heads/${DISPATCH_BRANCH}"
          if git push origin "${refspec}"; then
            exit 0
          fi
          remote_ref="origin/${DISPATCH_BRANCH}"
          if git rev-parse --verify "${remote_ref}" >/dev/null 2>&1; then
            echo "push rejected; rebasing onto ${remote_ref} and retrying"
            git pull --rebase origin "${DISPATCH_BRANCH}"
            git push origin "${refspec}"
            exit 0
          fi
          echo "git push failed and remote branch ${remote_ref} does not exist" >&2
          exit 1

      - name: Verify remote dispatch branch matches published commit
        id: verify-remote-dispatch
        working-directory: oblt-aw
        env:
          DISPATCH_BRANCH: ${{ env.DISPATCH_BRANCH }}
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          actual="$(gh api "repos/elastic/oblt-aw/git/ref/heads/${DISPATCH_BRANCH}" -q .object.sha)"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::remote ${DISPATCH_BRANCH} is ${actual}, expected ${expected} after push" >&2
            exit 1
          fi
          echo "remote ${DISPATCH_BRANCH} is at ${actual}"

      - name: Record published dispatch commit
        id: record-dispatch-sha
        working-directory: oblt-aw
        run: |
          set -euo pipefail
          echo "dispatch_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  verify-dispatch-branch:
    name: Verify dispatch branch before invoke
    needs:
      - publish-planned-dispatch
    if: needs.publish-planned-dispatch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: oblt-aw-dispatch-working
      cancel-in-progress: false
    steps:
      - name: Verify dispatch branch still at published commit
        env:
          DISPATCH_BRANCH: ${{ env.DISPATCH_BRANCH }}
          EXPECTED_SHA: ${{ needs.publish-planned-dispatch.outputs.dispatch_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/elastic/oblt-aw/git/ref/heads/${DISPATCH_BRANCH}" -q .object.sha)"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::remote ${DISPATCH_BRANCH} is ${actual}, expected ${EXPECTED_SHA} from publish-planned-dispatch in this run" >&2
            exit 1
          fi
          echo "remote ${DISPATCH_BRANCH} is at ${actual}"

  invoke-planned-dispatch:
    name: Invoke planned dispatch
    needs:
      - dashboard-enabled-workflows
      - load-allowed-authors
      - plan-routes
      - publish-planned-dispatch
      - verify-dispatch-branch
    if: >-
      needs.plan-routes.outputs.has-routes == 'true' &&
      needs.verify-dispatch-branch.result == 'success' &&
      (needs.dashboard-enabled-workflows.result == 'success' ||
        needs.dashboard-enabled-workflows.result == 'skipped')
    concurrency:
      group: oblt-aw-dispatch-working
      cancel-in-progress: false
    # Literal path and @ref — GitHub does not allow expressions in uses: (must match env above).
    # Branch tip is resolved when this job starts; verify-dispatch-branch ensures it matches this run's publish.
    uses: elastic/oblt-aw/.github/workflows/oblt-aw-planned-dispatch.yml@oblt-aw/dispatch/working
    with:
      allowed-pr-authors-csv: ${{ needs.load-allowed-authors.outputs.allowed_pr_authors_csv || '' }}
      allowed-issue-authors-csv: ${{ needs.load-allowed-authors.outputs.allowed_issue_authors_csv || '' }}
    secrets: inherit

  unsupported-trigger:
    name: Unsupported trigger
    needs: plan-routes
    if: needs.plan-routes.outputs.unsupported-trigger == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Unsupported trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          echo "This entrypoint does not support event '${EVENT_NAME}' with action '${EVENT_ACTION}'."
          exit 1
