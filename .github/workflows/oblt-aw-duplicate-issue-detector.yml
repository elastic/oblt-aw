---
name: Duplicate Issue Detector
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-event-context.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:

  duplicate-issue-detector:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    if: >-
      inputs.shared-proceed == 'true' &&
      (
        (github.event_name == 'issues' && github.event.action == 'opened') ||
        github.event_name == 'workflow_dispatch'
      )
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-duplicate-issue-detector.lock.yml@main
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
