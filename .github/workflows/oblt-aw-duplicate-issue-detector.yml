---
name: Duplicate Issue Detector
on:
  workflow_call:
    inputs:
      ingress-event-name:
        description: Relayed event name from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-action:
        description: Relayed event action from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-payload-json:
        description: Relayed github.event JSON from oblt-aw-ingress
        required: true
        type: string
      ingress-allowed-pr-authors-csv:
        description: Allowed PR bot logins from oblt-aw-ingress prelude
        required: false
        type: string
        default: ''
      ingress-allowed-issue-authors-csv:
        description: Allowed issue bot logins from oblt-aw-ingress prelude
        required: false
        type: string
        default: ''
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  resolve-apm-assets:
    permissions:
      contents: read
    uses: ./.github/workflows/aw-resolve-apm-assets.yml
    with:
      control-plane-workflow: oblt-aw-duplicate-issue-detector.yml
      ingress-event-name: ${{ inputs.ingress-event-name }}
      ingress-event-action: ${{ inputs.ingress-event-action }}
      ingress-event-payload-json: ${{ inputs.ingress-event-payload-json }}

  duplicate-issue-detector:
    needs: [resolve-apm-assets]
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-duplicate-issue-detector.lock.yml@main
    with:
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
