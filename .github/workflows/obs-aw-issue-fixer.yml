name: Issue Fixer
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-prelude.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
# Nested GH-AW jobs mint OIDC ephemeral tokens when github-token-policy is non-empty.
permissions:
  contents: read

jobs:

  resolve-apm-assets:
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/ai implement') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      !contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/detector/security') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/detector/res-not-accessible-by-integration') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/triage/security-') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/triage/res-not-accessible-by-integration')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-issue-fixer.yml
      # Shared draft/review/merge policy + GitHub-read/safe-output contract:
      # config/obs/instruction-fragments/ via instruction-fragment-map.json
      # (workflows.issue-fixer).
      platform-additional-instructions: |
        Your task is to fix issues requested through `/ai implement` comments.

        **Execution Preconditions:**
        - This run was already gated by workflow `if:` for `/ai implement` and author association.
        - Do **not** refuse solely because shell `gh` cannot re-check those preconditions.
        - Do not proceed if the issue includes any of these specialized detector or triage labels:
          - `oblt-aw/detector/security`
          - `oblt-aw/detector/res-not-accessible-by-integration`
          - `oblt-aw/triage/security-*`
          - `oblt-aw/triage/res-not-accessible-by-integration`
        - The issue must already contain a triage-generated resolution plan in the issue body or comments. Read it via GitHub MCP / `github` CLI.

        **Implementation Workflow (sequential and methodical):**
        1. Using GitHub MCP / `github` CLI, read the issue and its comments, extract the triage resolution plan, and list ordered tasks. Treat this plan as the source of truth.
        2. Execute the plan strictly step by step, without skipping steps.
        3. For each step, document what changed and why in commit messages and PR description.
        4. Run validation/tests described in the plan and confirm the issue is resolved.

        **Pull Request Requirements:**
        - Create a pull request in `Draft` state first.
        - PR title should reference fixing the issue.
        - PR body must include:
          - `Closes #<issue-number>` at the top to link and auto-close the source issue on merge
          - checklist of plan steps completed
          - evidence of successful tests/validation

  run:
    needs: [resolve-apm-assets]
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
      copilot-requests: write
      id-token: write
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/ai implement') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      !contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/detector/security') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/detector/res-not-accessible-by-integration') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/triage/security-') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/triage/res-not-accessible-by-integration')
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-issue-fixer.lock.yml@main
    with:
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
      github-token-policy: ${{ inputs.shared-token-policy }}
    secrets: inherit

  request-reviewers:
    needs: run
    if: needs.run.outputs.created_pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request review from elastic/observablt-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.run.outputs.created_pr_number }}
        run: gh pr edit "$PR_NUMBER" --add-reviewer "elastic/observablt-ci" --repo "$GITHUB_REPOSITORY"

  notify-no-pr:
    needs: run
    if: >-
      always() &&
      needs.run.result == 'success' &&
      needs.run.outputs.created_pr_number == ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on source issue when fixer opened no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Issue fixer finished without opening a pull request."
            echo
            echo "- Workflow run: ${RUN_URL}"
            echo "- Trigger: \`/ai implement\`"
            echo "- If the agent intentionally called \`noop\` / \`report_incomplete\`, treat that as the completion signal."
            echo "- If you expected a PR, check the run artifacts for empty safe outputs and any \`[aw] Issue Fixer produced no safe outputs\` meta-issue."
            echo
            echo "To retry: comment \`/ai implement\` again as an OWNER, MEMBER, or COLLABORATOR."
          } | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
