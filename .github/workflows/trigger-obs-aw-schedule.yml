name: Observability Agentic Workflow — Schedule

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      e2e-additional-instructions:
        description: >-
          Optional E2E-only platform instructions for obs:autodoc (leave empty
          for normal schedule/manual runs).
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run-obs-aw-schedule:
    permissions:
      actions: read
      contents: write
      copilot-requests: write
      id-token: write
      issues: write
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/obs-aw-event-schedule.yml@main # ratchet:exclude
    with:
      e2e-additional-instructions: ${{ github.event.inputs.e2e-additional-instructions || '' }}
