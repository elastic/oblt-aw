---
name: docs-cleanup

# Removes Codex preview deployments when a docs/** pull request is closed.
# File name must remain codex-preview-cleanup.yml (OIDC / platform bindings).
on:
  pull_request_target:
    types:
      - closed
    paths:
      - "docs/**"

permissions:
  contents: read

jobs:
  cleanup:
    permissions:
      contents: none
      deployments: write
      id-token: write
    uses: elastic/docs-actions/.github/workflows/codex-preview-cleanup.yml@e1608f9d7c62bc4c59ab21fc691809351b1a31aa # ratchet:elastic/docs-actions/.github/workflows/codex-preview-cleanup.yml@v1
