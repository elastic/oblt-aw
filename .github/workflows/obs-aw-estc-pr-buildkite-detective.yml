---
name: PR Buildkite Detective
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-prelude.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
    secrets:
      BUILDKITE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:

  check-pr:
    if: >-
      github.event_name == 'status' &&
      github.event.state == 'failure' &&
      contains(github.event.context, 'buildkite')
    runs-on: ubuntu-latest
    outputs:
      has-open-pr: ${{ steps.find-pr.outputs.has-open-pr }}
    permissions:
      pull-requests: read
    steps:
      - name: Check for open PR associated with commit
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.sha }}/pulls" \
            --jq '[.[] | select(.state == "open")] | length')
          if [ "$count" -gt 0 ]; then
            echo "has-open-pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-open-pr=false" >> "$GITHUB_OUTPUT"
          fi

  resolve-apm-assets:
    if: needs.check-pr.outputs.has-open-pr == 'true'
    needs: [check-pr]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      control-plane-workflow: obs-aw-estc-pr-buildkite-detective.yml
      platform-additional-instructions: |
        If a step fails, check if the failure is reported as a GitHub issue labeled `flaky-test`. Reference the GitHub issue if so.

  estc-pr-buildkite-detective:
    needs: [resolve-apm-assets]
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
      copilot-requests: write
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-estc-pr-buildkite-detective.lock.yml@main
    with:
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
    secrets:
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
