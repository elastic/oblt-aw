---
name: E2E — All

# Manual orchestrator: call every leaf e2e-*.yml via workflow_call in parallel.
# Add a new job here when introducing a new leaf E2E workflow.
# Not part of the default PR required gate in ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-all
  cancel-in-progress: false

jobs:
  e2e-automerge-vm-images:
    name: Automerge vm-images
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
      checks: read
      id-token: write
    uses: ./.github/workflows/e2e-automerge-vm-images.yml

  e2e-dependency-review:
    name: Dependency review
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
      checks: read
      id-token: write
    uses: ./.github/workflows/e2e-dependency-review.yml

  e2e-estc-pr-buildkite-detective:
    name: ESTC PR Buildkite Detective
    permissions:
      contents: write
      pull-requests: write
      statuses: read
      actions: read
      issues: write
      checks: read
    uses: ./.github/workflows/e2e-estc-pr-buildkite-detective.yml
    secrets:
      BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}

  e2e-autodoc:
    name: Autodoc audit
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
      checks: read
      id-token: write
    uses: ./.github/workflows/e2e-autodoc.yml
