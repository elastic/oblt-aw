---
name: E2E — All

# Orchestrator: call every leaf e2e-*.yml via workflow_call in parallel.
# Add a new job here when introducing a new leaf E2E workflow.
# Not part of the default PR required gate in ci.yml.
# Called by aw-release-promote.yml (pinned SHA); also dispatchable for smoke.
on:
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: Git ref or full SHA to checkout (default main tip)
        required: false
        type: string
        default: main
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or full SHA to checkout (default main tip)
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: e2e-all
  cancel-in-progress: false

jobs:
  e2e-automerge-vm-images:
    name: Automerge vm-images
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
      checks: read
      id-token: write
    uses: ./.github/workflows/e2e-automerge-vm-images.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref }}
    secrets: inherit

  e2e-dependency-review:
    name: Dependency review
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
      checks: read
      id-token: write
    uses: ./.github/workflows/e2e-dependency-review.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref }}
    secrets: inherit

  e2e-estc-pr-buildkite-detective:
    name: ESTC PR Buildkite Detective
    permissions:
      contents: write
      pull-requests: write
      statuses: read
      actions: read
      issues: write
      checks: read
    uses: ./.github/workflows/e2e-estc-pr-buildkite-detective.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref }}
    secrets: inherit

  e2e-autodoc:
    name: Autodoc audit
    permissions:
      actions: write
      checks: read
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/e2e-autodoc.yml
    with:
      checkout-ref: ${{ inputs.checkout-ref }}
    secrets: inherit
