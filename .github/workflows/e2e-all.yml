---
name: E2E — All

# Manual orchestrator: discover every leaf .github/workflows/e2e-*.yml
# (except this file), dispatch each on the selected ref, wait in parallel,
# and fail if any child fails. New leaf E2Es are picked up automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-all
  cancel-in-progress: false

jobs:
  run-all:
    name: Run all E2E workflows
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install Python dependencies
        run: pip install -r requirements-runtime.txt

      - name: Discover and run leaf E2E workflows
        run: |
          set -euo pipefail
          python3 scripts/obs/e2e/run_all_e2e_workflows.py \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${GITHUB_REF_NAME}"
