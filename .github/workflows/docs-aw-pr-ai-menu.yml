name: Docs PR AI menu

# Reusable implementation for the Elastic Docs PR AI menu. Routed from docs-aw-ingress.yml.
# Scripts: `scripts/docs/pr-menu/`.

on:
  workflow_call:
    inputs:
      ingress-event-name:
        description: Relayed event name from docs-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-action:
        description: Relayed event action from docs-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-payload-json:
        description: Relayed github.event JSON from docs-aw-ingress
        required: false
        type: string
        default: ''
      ingress-token-policy:
        description: Token policy resolved by docs-aw-ingress prelude
        required: false
        type: string
        default: ''
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  post-menu:
    name: Post or refresh AI PR menu
    if: >-
      (
        (
          inputs.ingress-event-name != '' && inputs.ingress-event-name ||
          github.event_name
        ) == 'workflow_run' &&
        fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).workflow_run.conclusion == 'success'
      ) ||
      (
        inputs.ingress-event-name != '' && inputs.ingress-event-name ||
        github.event_name
      ) == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: docs-pr-ai-menu-${{ fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).workflow_run.id || fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).pull_request.number || fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).issue.number || fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).inputs.pull_request_number }}
      cancel-in-progress: false
    steps:
      - name: Download pull request number artifact
        if: >-
          (
            inputs.ingress-event-name != '' && inputs.ingress-event-name ||
            github.event_name
          ) == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: pr-number
          run-id: ${{ fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pull request number
        id: resolve-pr
        env:
          EVENT_NAME: ${{ inputs.ingress-event-name != '' && inputs.ingress-event-name || github.event_name }}
          WORKFLOW_DISPATCH_PR: ${{ fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).inputs.pull_request_number }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            echo "number=$(cat pr_number.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "number=${WORKFLOW_DISPATCH_PR}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout oblt-aw for Docs PR AI menu scripts
        uses: actions/checkout@v6
        with:
          repository: elastic/oblt-aw
          ref: main
          path: oblt-aw-scripts
          fetch-depth: 1
          sparse-checkout: |
            scripts/docs/pr-menu
          sparse-checkout-cone-mode: true

      - name: Create or update AI PR menu comment
        uses: actions/github-script@v9
        env:
          PULL_REQUEST_NUMBER: ${{ steps.resolve-pr.outputs.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fn = require('./oblt-aw-scripts/scripts/docs/pr-menu/post-menu.js')
            await fn({github, context, core})

  evaluate-trigger:
    name: Evaluate AI PR menu trigger
    if: >-
      (
        inputs.ingress-event-name != '' && inputs.ingress-event-name ||
        github.event_name
      ) == 'issue_comment' &&
      fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).issue.pull_request != null &&
      github.actor != 'github-actions[bot]' &&
      fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).comment.user.login == 'github-actions[bot]' &&
      contains(fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).comment.body, '<!-- docs-pr-ai-menu:start -->') &&
      contains(fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).comment.body, '<!-- docs-pr-ai-menu:end -->')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_review_triggered: ${{ steps.evaluate.outputs.docs_review_triggered }}
    steps:
      - name: Checkout oblt-aw for Docs PR AI menu scripts
        uses: actions/checkout@v6
        with:
          repository: elastic/oblt-aw
          ref: main
          path: oblt-aw-scripts
          fetch-depth: 1
          sparse-checkout: |
            scripts/docs/pr-menu
          sparse-checkout-cone-mode: true

      - name: Parse AI PR menu transition
        id: evaluate
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fn = require('./oblt-aw-scripts/scripts/docs/pr-menu/evaluate-trigger.js')
            await fn({github, context, core})

  refresh-menu-after-trigger:
    name: Refresh AI PR menu after trigger
    needs: [evaluate-trigger]
    if: needs.evaluate-trigger.outputs.docs_review_triggered == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: docs-pr-ai-menu-${{ fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).pull_request.number || fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).issue.number || fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).inputs.pull_request_number }}
      cancel-in-progress: false
    steps:
      - name: Checkout oblt-aw for Docs PR AI menu scripts
        uses: actions/checkout@v6
        with:
          repository: elastic/oblt-aw
          ref: main
          path: oblt-aw-scripts
          fetch-depth: 1
          sparse-checkout: |
            scripts/docs/pr-menu
          sparse-checkout-cone-mode: true

      - name: Refresh AI PR menu status
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fn = require('./oblt-aw-scripts/scripts/docs/pr-menu/refresh-after-trigger.js')
            await fn({github, context, core})

  run-docs-review:
    name: Docs AI / docs review
    needs: [evaluate-trigger]
    if: needs.evaluate-trigger.outputs.docs_review_triggered == 'true'
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: elastic/docs-actions/.github/workflows/gh-aw-docs-review.lock.yml@v1
    with:
      review-scope: repo-wide-markdown
      additional-instructions: |
        This repository stores documentation as markdown across the repository.
        Prefer concise, high-signal review comments with exact replacement text when possible.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  refresh-menu-after-docs-review:
    name: Refresh AI PR menu after docs review
    needs: [evaluate-trigger, run-docs-review]
    if: always() && needs.evaluate-trigger.outputs.docs_review_triggered == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: docs-pr-ai-menu-${{ fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).pull_request.number || fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).issue.number || fromJSON(inputs.ingress-event-payload-json != '' && inputs.ingress-event-payload-json || toJSON(github.event)).inputs.pull_request_number }}
      cancel-in-progress: false
    steps:
      - name: Checkout oblt-aw for Docs PR AI menu scripts
        uses: actions/checkout@v6
        with:
          repository: elastic/oblt-aw
          ref: main
          path: oblt-aw-scripts
          fetch-depth: 1
          sparse-checkout: |
            scripts/docs/pr-menu
          sparse-checkout-cone-mode: true

      - name: Refresh AI PR menu status
        uses: actions/github-script@v9
        env:
          DOCS_REVIEW_RESULT: ${{ needs.run-docs-review.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fn = require('./oblt-aw-scripts/scripts/docs/pr-menu/refresh-after-docs-review.js')
            await fn({github, context, core})
