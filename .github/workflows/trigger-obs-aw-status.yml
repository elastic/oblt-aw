name: Observability Agentic Workflow — Status

on:
  status:

permissions:
  contents: read

jobs:
  run-obs-aw-status:
    if: >-
      github.event.state == 'failure' &&
      contains(github.event.context, 'buildkite')
    permissions:
      actions: read
      contents: read
      copilot-requests: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/obs-aw-event-status.yml
    secrets:
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_LOGS_API_TOKEN }}
