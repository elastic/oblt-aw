---
name: PR Buildkite Detective
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-event-context.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true
      BUILDKITE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:

  estc-pr-buildkite-detective:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    if: >-
      inputs.shared-proceed == 'true' &&
      github.event_name == 'status' &&
      github.event.state == 'failure' &&
      contains(github.event.context, 'buildkite')
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-estc-pr-buildkite-detective.lock.yml@copilot/reduce-comment-spamming
    with:
      additional-instructions: |
        If a step fails, check if the failure is reported as a GitHub issue labeled `flaky-test`. Reference the GitHub issue if so.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
