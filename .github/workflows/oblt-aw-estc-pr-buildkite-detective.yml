---
name: PR Buildkite Detective
on:
  workflow_call:
    inputs:
      ingress-event-name:
        description: Relayed event name from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-action:
        description: Relayed event action from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-payload-json:
        description: Relayed github.event JSON from oblt-aw-ingress
        required: true
        type: string
      ingress-allowed-pr-authors-csv:
        description: Allowed PR bot logins from oblt-aw-ingress prelude
        required: false
        type: string
        default: ''
      ingress-allowed-issue-authors-csv:
        description: Allowed issue bot logins from oblt-aw-ingress prelude
        required: false
        type: string
        default: ''
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true
      BUILDKITE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:

  resolve-apm-assets:
    permissions:
      contents: read
    uses: ./.github/workflows/aw-resolve-apm-assets.yml
    with:
      control-plane-workflow: oblt-aw-estc-pr-buildkite-detective.yml
      ingress-event-name: ${{ inputs.ingress-event-name }}
      ingress-event-action: ${{ inputs.ingress-event-action }}
      ingress-event-payload-json: ${{ inputs.ingress-event-payload-json }}
      platform-additional-instructions: |
        If a step fails, check if the failure is reported as a GitHub issue labeled `flaky-test`. Reference the GitHub issue if so.

  estc-pr-buildkite-detective:
    needs: [resolve-apm-assets]
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    if: >-
      github.event_name == 'status' &&
      github.event.state == 'failure' &&
      contains(github.event.context, 'buildkite')
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-estc-pr-buildkite-detective.lock.yml@copilot/reduce-comment-spamming
    with:
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
      setup-commands: ${{ join(fromJSON(needs.resolve-apm-assets.outputs.resolved-setup-commands-json), ' && ') }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
