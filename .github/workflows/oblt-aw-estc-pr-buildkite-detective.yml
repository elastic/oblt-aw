---
name: PR Buildkite Detective
on:
  workflow_call:
    inputs:
      ingress-event-name:
        description: Relayed event name from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-action:
        description: Relayed event action from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-payload-json:
        description: Relayed github.event JSON from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-allowed-pr-authors-csv:
        description: Allowed PR bot logins from oblt-aw-ingress prelude
        required: false
        type: string
        default: ''
      ingress-allowed-issue-authors-csv:
        description: Allowed issue bot logins from oblt-aw-ingress prelude
        required: false
        type: string
        default: ''
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true
      BUILDKITE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:

  estc-pr-buildkite-detective:
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-estc-pr-buildkite-detective.lock.yml@copilot/reduce-comment-spamming
    with:
      additional-instructions: |
        If a step fails, check if the failure is reported as a GitHub issue labeled `flaky-test`. Reference the GitHub issue if so.
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
