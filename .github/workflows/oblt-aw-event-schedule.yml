name: Observability Agentic Workflow — Schedule Event

# Event-scoped orchestrator: one shared prelude chain for all schedule/workflow_dispatch routes.
on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  event-context:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/aw-event-context.yml
    with:
      control-plane-workflows: >-
        ["oblt-aw-agent-suggestions.yml","oblt-aw-autodoc.yml","oblt-aw-security-detector.yml","oblt-aw-resource-not-accessible-by-integration-detector.yml"]
      load-allowed-authors: false

  agent-suggestions:
    needs: event-context
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/oblt-aw-agent-suggestions.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-agent-suggestions.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  autodoc:
    needs: event-context
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-autodoc.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-autodoc.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  security-detector:
    needs: event-context
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    uses: ./.github/workflows/oblt-aw-security-detector.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-security-detector.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}

  resource-not-accessible-detector:
    needs: event-context
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/oblt-aw-resource-not-accessible-by-integration-detector.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-resource-not-accessible-by-integration-detector.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
