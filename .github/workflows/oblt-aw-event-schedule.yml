name: Observability Agentic Workflow — Schedule Event

# Event-scoped orchestrator: one shared prelude chain for all schedule/workflow_dispatch routes.
on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  prelude:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/aw-prelude.yml
    with:
      control-plane-workflows: >-
        ["oblt-aw-agent-suggestions.yml","oblt-aw-autodoc.yml","oblt-aw-security-detector.yml","oblt-aw-resource-not-accessible-by-integration-detector.yml"]
      load-allowed-authors: false

  agent-suggestions:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-agent-suggestions.yml'] == 'true'
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    uses: ./.github/workflows/oblt-aw-agent-suggestions.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-agent-suggestions.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  autodoc:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-autodoc.yml'] == 'true'
    permissions:
      actions: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-autodoc.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-autodoc.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  security-detector:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-security-detector.yml'] == 'true' &&
      contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name)
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    uses: ./.github/workflows/oblt-aw-security-detector.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-security-detector.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}

  resource-not-accessible-detector:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-resource-not-accessible-by-integration-detector.yml'] == 'true' &&
      github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
    uses: ./.github/workflows/oblt-aw-resource-not-accessible-by-integration-detector.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-resource-not-accessible-by-integration-detector.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
