---
name: AW release — promote

# Promote tip of main: run leaf E2E, bump semver, move vN + previous-prod tags.
# Runbook: docs/operations/agentic-release-model.md
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Semver bump from current prod (ignored on first promote → v1.0.0)
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch
      dry-run:
        description: Run E2E and plan only (no tags, no pointer commit)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aw-release-promote
  cancel-in-progress: false

jobs:
  guard:
    name: Require default branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless dispatched on default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="refs/heads/${DEFAULT_BRANCH}"
          if [ "${REF}" != "${expected}" ]; then
            echo "::error::Promote must run on ${expected} (got ${REF})"
            exit 1
          fi
          echo "Releasing tip of ${DEFAULT_BRANCH} @ ${{ github.sha }}"

  e2e-automerge-vm-images:
    name: Automerge vm-images
    needs: guard
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
      checks: read
      id-token: write
    uses: ./.github/workflows/e2e-automerge-vm-images.yml
    secrets: inherit

  e2e-dependency-review:
    name: Dependency review
    needs: guard
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
      checks: read
      id-token: write
    uses: ./.github/workflows/e2e-dependency-review.yml
    secrets: inherit

  e2e-estc-pr-buildkite-detective:
    name: ESTC PR Buildkite Detective
    needs: guard
    permissions:
      contents: write
      pull-requests: write
      statuses: read
      actions: read
      issues: write
      checks: read
    uses: ./.github/workflows/e2e-estc-pr-buildkite-detective.yml
    secrets: inherit

  e2e-autodoc:
    name: Autodoc audit
    needs: guard
    permissions:
      actions: write
      checks: read
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/e2e-autodoc.yml
    secrets: inherit

  promote:
    name: Tag and update pointers
    needs:
      - e2e-autodoc
      - e2e-automerge-vm-images
      - e2e-dependency-review
      - e2e-estc-pr-buildkite-detective
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Promote tags and update pointers
        id: promote
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${DRY_RUN}" = "true" ]; then
            extra+=(--dry-run)
          else
            extra+=(--push)
          fi
          python3 scripts/aw_release_promote.py \
            --sha "${RELEASE_SHA}" \
            --release-type "${RELEASE_TYPE}" \
            "${extra[@]}"

      - name: Commit release-pointers.json
        if: ${{ inputs.dry-run != true }}
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail
          if git diff --quiet -- config/release-pointers.json; then
            echo "No pointer file changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/release-pointers.json
          git commit -m "chore(release): promote ${RELEASE_TYPE} (${RELEASE_SHA:0:12})"
          git push origin HEAD:"${{ github.ref_name }}"
