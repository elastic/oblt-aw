---
name: AW release — promote

# Promote a default-branch SHA: run e2e-all, bump semver, move vN + previous tags,
# commit pointers, and create a GitHub Release with auto-generated notes.
# Runbook: docs/operations/agentic-release-model.md
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: Semver bump from current prod (ignored on first promote → v0.0.0)
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch
      promote-sha:
        description: Optional full SHA to promote (must be on default-branch history; default = tip at dispatch)
        required: false
        type: string
        default: ""
      dry-run:
        description: Run E2E and plan only (no tags, no pointer commit, no GitHub Release)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aw-release-promote
  cancel-in-progress: false

jobs:
  guard:
    name: Require default branch
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      release-sha: ${{ steps.resolve.outputs.release-sha }}
    steps:
      - name: Fail unless dispatched on default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="refs/heads/${DEFAULT_BRANCH}"
          if [ "${REF}" != "${expected}" ]; then
            echo "::error::Promote must run on ${expected} (got ${REF})"
            exit 1
          fi

      - name: Resolve promote SHA
        id: resolve
        env:
          PROMOTE_SHA: ${{ inputs.promote-sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PROMOTE_SHA}" ]; then
            release_sha="${PROMOTE_SHA}"
          else
            release_sha="${DISPATCH_SHA}"
          fi
          release_sha="$(printf '%s' "${release_sha}" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::promote-sha must be a 40-char hex SHA (got ${release_sha})"
            exit 1
          fi
          echo "release-sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${{ github.event.repository.default_branch }} history @ ${release_sha}"

  e2e-all:
    name: E2E — All
    needs: guard
    permissions:
      actions: write
      checks: read
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      statuses: read
    uses: ./.github/workflows/e2e-all.yml
    with:
      checkout-ref: ${{ needs.guard.outputs.release-sha }}
    secrets: inherit

  promote:
    name: Tag and update pointers
    needs:
      - guard
      - e2e-all
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.guard.outputs.release-sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Configure Git identity
        uses: elastic/oblt-actions/git/setup@v1

      - name: Promote tags and update pointers (local)
        id: promote
        env:
          RELEASE_SHA: ${{ needs.guard.outputs.release-sha }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          DRY_RUN: ${{ inputs.dry-run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          extra=(
            --plan-output promote-plan.json
            --require-ancestor-of "origin/${DEFAULT_BRANCH}"
          )
          if [ "${DRY_RUN}" = "true" ]; then
            extra+=(--dry-run)
          fi
          python3 scripts/aw_release_promote.py \
            --sha "${RELEASE_SHA}" \
            --release-type "${RELEASE_TYPE}" \
            "${extra[@]}"

      - name: Commit release-pointers.json
        if: ${{ inputs.dry-run != true }}
        env:
          RELEASE_SHA: ${{ needs.guard.outputs.release-sha }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- config/release-pointers.json; then
            echo "No pointer file changes to commit"
            exit 0
          fi
          git add config/release-pointers.json
          git commit -m "chore(release): promote ${RELEASE_TYPE} (${RELEASE_SHA:0:12})"
          git fetch origin "${DEFAULT_BRANCH}"
          # Rebase onto current tip so push stays fast-forward when main advanced
          # during E2E while we still release the gated SHA.
          git rebase "origin/${DEFAULT_BRANCH}"
          git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"

      - name: Push release tags
        if: ${{ inputs.dry-run != true }}
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/aw_release_promote.py --push-from-plan promote-plan.json

      - name: Create GitHub Release with generated notes
        if: ${{ inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/aw_release_promote.py --create-release-from-plan promote-plan.json
