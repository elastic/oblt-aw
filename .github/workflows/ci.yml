---
name: CI

# Trigger on PRs targeting any branch (opened, updated, reopened).
# Same-repo E2E fixture PRs (any e2e:* label on an e2e/* head) skip work jobs
# via the ci-gate output — evaluated once, not per job.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

# Avoid workflow-root permissions; define at job scope only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: Detect E2E fixture PR
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Evaluate E2E fixture skip
        id: detect
        env:
          IS_E2E_FIXTURE: ${{ contains(toJSON(github.event.pull_request.labels.*.name), '"e2e:') && startsWith(github.event.pull_request.head.ref, 'e2e/') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          # Expression renders as lowercase true/false.
          echo "skip=${IS_E2E_FIXTURE}" >> "${GITHUB_OUTPUT}"
          if [ "${IS_E2E_FIXTURE}" = "true" ]; then
            echo "Skipping CI work jobs for same-repo E2E fixture PR (e2e:* on e2e/*)."
          fi

  pre-commit:
    name: Pre-commit
    needs: ci-gate
    if: needs.ci-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Run pre-commit
        uses: elastic/oblt-actions/pre-commit@v1
        with:
          python-version: "3.14"

  python-tests:
    name: Python tests
    needs: ci-gate
    if: needs.ci-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-runtime.txt

      - name: Install Python test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run unit and integration tests
        run: pytest tests/unit tests/integration -v --tb=short

      - name: Validate *-aw-* workflows call aw-prelude
        run: python scripts/validate_aw_workflow_prelude.py

      - name: Validate gh-aw-* workflows call resolve-agentic-assets
        run: python scripts/validate_aw_workflow_resolve_agentic_assets.py

      - name: Validate obs-aw-* callers set report-failure-as-issue false
        run: python scripts/validate_aw_workflow_report_failure_as_issue.py

      - name: Validate reusable-workflow caller permissions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_aw_workflow_permissions.py

  gh-aw-drift:
    name: gh-aw drift check
    needs: ci-gate
    if: needs.ci-gate.outputs.skip != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Recompile gh-aw workflows and fail on generated drift
        run: make compile-aw-check

  typescript-tests:
    name: TypeScript tests
    needs: ci-gate
    if: needs.ci-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  scorecard:
    name: OpenSSF Scorecard
    needs: ci-gate
    if: needs.ci-gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard results to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: scorecard-results.sarif

  required:
    name: All checks passed
    if: always()
    needs:
      - ci-gate
      - pre-commit
      - python-tests
      - gh-aw-drift
      - typescript-tests
      - scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Pass for e2e fixture PRs
        if: needs.ci-gate.outputs.skip == 'true'
        run: echo "CI skipped for dedicated E2E fixture PR (e2e:* label on e2e/* branch)."

      - name: Check dependent jobs
        if: needs.ci-gate.outputs.skip != 'true'
        id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}

      - name: Fail if any job failed
        if: >-
          needs.ci-gate.outputs.skip != 'true' &&
          steps.check.outputs.status == 'failure'
        run: |
          set -euo pipefail
          echo "One or more required jobs failed."
          exit 1

      - name: All checks passed
        if: >-
          needs.ci-gate.outputs.skip != 'true' &&
          steps.check.outputs.status == 'success'
        run: echo "All checks passed."
