---
name: CI

# Trigger on PRs targeting any branch (opened, updated, reopened).
# Skip when any PR label starts with e2e: (long-lived E2E fixture PRs).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

# Avoid workflow-root permissions; define at job scope only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    if: >-
      !(
        startsWith(join(github.event.pull_request.labels.*.name, ','), 'e2e:') ||
        contains(join(github.event.pull_request.labels.*.name, ','), ',e2e:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Run pre-commit
        uses: elastic/oblt-actions/pre-commit@v1
        with:
          python-version: "3.14"

  python-tests:
    name: Python tests
    if: >-
      !(
        startsWith(join(github.event.pull_request.labels.*.name, ','), 'e2e:') ||
        contains(join(github.event.pull_request.labels.*.name, ','), ',e2e:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-runtime.txt

      - name: Install Python test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Validate *-aw-* workflows call aw-prelude
        run: python scripts/validate_aw_workflow_prelude.py

      - name: Validate gh-aw-* workflows call resolve-agentic-assets
        run: python scripts/validate_aw_workflow_resolve_agentic_assets.py

      - name: Validate reusable-workflow caller permissions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_aw_workflow_permissions.py

  typescript-tests:
    name: TypeScript tests
    if: >-
      !(
        startsWith(join(github.event.pull_request.labels.*.name, ','), 'e2e:') ||
        contains(join(github.event.pull_request.labels.*.name, ','), ',e2e:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  scorecard:
    name: OpenSSF Scorecard
    if: >-
      !(
        startsWith(join(github.event.pull_request.labels.*.name, ','), 'e2e:') ||
        contains(join(github.event.pull_request.labels.*.name, ','), ',e2e:')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard results to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: scorecard-results.sarif

  required:
    name: All checks passed
    if: always()
    needs:
      - pre-commit
      - python-tests
      - typescript-tests
      - scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Pass for e2e fixture PRs
        if: >-
          startsWith(join(github.event.pull_request.labels.*.name, ','), 'e2e:') ||
          contains(join(github.event.pull_request.labels.*.name, ','), ',e2e:')
        run: echo "CI skipped for e2e:* fixture PR."

      - name: Check dependent jobs
        if: >-
          !(
            startsWith(join(github.event.pull_request.labels.*.name, ','), 'e2e:') ||
            contains(join(github.event.pull_request.labels.*.name, ','), ',e2e:')
          )
        id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}

      - name: Fail if any job failed
        if: >-
          !(
            startsWith(join(github.event.pull_request.labels.*.name, ','), 'e2e:') ||
            contains(join(github.event.pull_request.labels.*.name, ','), ',e2e:')
          ) &&
          steps.check.outputs.status == 'failure'
        run: |
          set -euo pipefail
          echo "One or more required jobs failed."
          exit 1

      - name: All checks passed
        if: >-
          !(
            startsWith(join(github.event.pull_request.labels.*.name, ','), 'e2e:') ||
            contains(join(github.event.pull_request.labels.*.name, ','), ',e2e:')
          ) &&
          steps.check.outputs.status == 'success'
        run: echo "All checks passed."
