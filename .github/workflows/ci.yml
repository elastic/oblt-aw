---
name: CI

# Trigger on PRs targeting main (opened, updated, reopened).
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

# Avoid workflow-root permissions; define at job scope only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Run pre-commit
        uses: elastic/oblt-actions/pre-commit@v1
        with:
          python-version: "3.14"

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python test dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Validate *-aw-* workflows call aw-prelude
        run: python scripts/validate_aw_workflow_prelude.py

      - name: Validate ingress route registries
        run: python scripts/validate_ingress_registry.py

      - name: Validate gh-aw-* workflows call resolve-apm-assets
        run: python scripts/validate_aw_workflow_resolve_apm_assets.py

  typescript-tests:
    name: TypeScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard results to GitHub Security
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          sarif_file: scorecard-results.sarif

  required:
    name: All checks passed
    if: always()
    needs:
      - pre-commit
      - python-tests
      - typescript-tests
      - scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Check dependent jobs
        id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}

      - name: Fail if any job failed
        if: steps.check.outputs.status == 'failure'
        run: |
          set -euo pipefail
          echo "One or more required jobs failed."
          exit 1

      - name: All checks passed
        if: steps.check.outputs.status == 'success'
        run: echo "All checks passed."
