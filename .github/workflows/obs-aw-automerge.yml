name: Automerge
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-prelude.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
      shared-enabled-workflows:
        description: Normalized JSON array of compound workflow ids from aw-prelude.
        required: true
        type: string
# Nested GH-AW approve omits github-token-policy (lock default → GITHUB_TOKEN).
# Merge jobs mint OIDC ephemeral tokens when shared-token-policy is non-empty.
permissions:
  contents: read

jobs:

  # Single PR from github.event.pull_request. PR fields only (pull_request trigger).
  verify:
    if: inputs.shared-proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.validate.outputs.proceed }}
    steps:
      - name: Checkout elastic/oblt-aw (automerge verify only)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            config/obs/allowed_pr_authors.json
            scripts/obs/validateAutomergePr.ts
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: _oblt-aw/package-lock.json

      - name: Install npm dependencies
        working-directory: _oblt-aw
        run: npm ci

      - name: Validate pull request for automerge
        id: validate
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHARED_TOKEN_POLICY: ${{ inputs.shared-token-policy }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require('node:path');
            const { createRequire } = require('node:module');
            const root = path.join(process.env.GITHUB_WORKSPACE, '_oblt-aw');
            const rq = createRequire(path.join(root, 'package.json'));
            rq('tsx/cjs/api').register();
            const { run } = rq('./scripts/obs/validateAutomergePr.ts');
            const prNumber = parseInt(process.env.PR_NUMBER || '', 10);
            const { ok } = await run({
              github,
              context,
              prNumber,
              core,
              sharedTokenPolicy: process.env.SHARED_TOKEN_POLICY || '',
            });
            core.setOutput('proceed', ok ? 'true' : 'false');

  # Classify dependency updates by changed file paths (no extra labels in consumer repos).
  # Posts a single PR comment when the collection is inactive, ambiguous, or unclassified.
  check-dependency-collection:
    needs: verify
    if: inputs.shared-proceed == 'true' && needs.verify.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      allowed: ${{ steps.check-collection.outputs.allowed }}
      collection-id: ${{ steps.check-collection.outputs.collection-id }}
    steps:
      - name: Checkout elastic/oblt-aw (dependency collection gate only)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            config/obs/automerge-dependency-collections.json
            scripts/obs/checkAutomergeDependencyCollection.ts
            scripts/obs/classifyAutomergeDependencyCollection.ts
            scripts/obs/lib/matchPathGlob.ts
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: _oblt-aw/package-lock.json

      - name: Install npm dependencies
        working-directory: _oblt-aw
        run: npm ci

      - name: Check dependency collection for automerge
        id: check-collection
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ENABLED_WORKFLOWS_JSON: ${{ inputs.shared-enabled-workflows }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require('node:path');
            const { createRequire } = require('node:module');
            const root = path.join(process.env.GITHUB_WORKSPACE, '_oblt-aw');
            const rq = createRequire(path.join(root, 'package.json'));
            rq('tsx/cjs/api').register();
            const { run } = rq('./scripts/obs/checkAutomergeDependencyCollection.ts');
            const prNumber = parseInt(process.env.PR_NUMBER || '', 10);
            const { allowed, collectionId } = await run({
              github,
              context,
              prNumber,
              core,
              enabledWorkflowsJson: process.env.ENABLED_WORKFLOWS_JSON || '[]',
            });
            core.setOutput('allowed', allowed ? 'true' : 'false');
            core.setOutput('collection-id', collectionId || '');

  # Approve identity must differ from the PR author (GitHub rejects self-APPROVE).
  # Default: GITHUB_TOKEN (github-actions[bot]). When the author is github-actions[bot],
  # pass shared-token-policy so the nested lock mints Vault. Merge still uses Vault when
  # shared-token-policy is set. Automerge continues via needs (no re-trigger for the review).
  resolve-apm-assets:
    needs: [verify, check-dependency-collection]
    if: >-
      inputs.shared-proceed == 'true' &&
      needs.verify.outputs.proceed == 'true' &&
      needs.check-dependency-collection.outputs.allowed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-automerge.yml
      platform-additional-instructions: |
        Target pull request number: ${{ github.event.pull_request.number }}.

  approve:
    needs: [verify, check-dependency-collection, resolve-apm-assets]
    if: >-
      inputs.shared-proceed == 'true' &&
      needs.verify.outputs.proceed == 'true' &&
      needs.check-dependency-collection.outputs.allowed == 'true'
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
      copilot-requests: write
      # Callee lock always declares id-token: write (mint is skipped when policy is empty).
      id-token: write
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-mention-in-pr.lock.yml@main
    with:
      allowed-bot-users: ${{ inputs.shared-allowed-pr-authors-csv }}
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
      # Empty → GITHUB_TOKEN; non-empty only when author is github-actions[bot] (avoid self-APPROVE).
      github-token-policy: ${{ github.event.pull_request.user.login == 'github-actions[bot]' && inputs.shared-token-policy || '' }}
      report-failure-as-issue: false
      prompt: |
        For pull request #${{ github.event.pull_request.number }}: evaluate automerge eligibility.

        This PR already passed automerge validation in the workflow (GITHUB_TOKEN) for author, label, draft/fork/ref, and dependency collection `${{ needs.check-dependency-collection.outputs.collection-id }}` (file-path classification; no extra repo labels).
        Do not call check-run or commit status APIs. Required checks are enforced by GitHub at merge time (PR path and deferred merge path).

        Author allow list (single source of truth — do not invent other names):
        - Canonical list (from config/obs/allowed_pr_authors.json): `${{ inputs.shared-allowed-pr-authors-csv }}`
        - Webhook/REST login for this PR: `${{ github.event.pull_request.user.login }}`
        - Before comparing any author string to that list, normalize GraphQL `app/<slug>` to `<slug>[bot]` (gh ≥ 2.50 `gh pr view` / pr.json often use the app/ form). Prefer the webhook/REST login above for the author gate.

        Approve the PR only when all of these gates are true:
        - Normalized PR author is in the canonical allow list above
        - PR has label `oblt-aw/ai/merge-ready`
        - PR is not draft
        - PR is not from a fork (head repo equals base repo)
        - Head ref is different from base ref

        If any gate is false, do not approve and do not request changes.
        Keep output minimal.

  # When shared-token-policy is set, merge as the Vault app (ephemeral token) so repo
  # pull_request_bypassers for that app can skip CODEOWNERS. Otherwise use GITHUB_TOKEN.
  # pascalgn uses the REST merge API, which honors classic BP bypassers for App tokens.
  # Author/label rules are enforced in `verify` (validateAutomergePr).
  # Approve actor ≠ PR author; MERGE_REQUIRED_APPROVALS is 1.
  automerge:
    needs:
      - verify
      - check-dependency-collection
      - approve
    if: >-
      always() &&
      !cancelled() &&
      inputs.shared-proceed == 'true' &&
      needs.verify.outputs.proceed == 'true' &&
      needs.check-dependency-collection.outputs.allowed == 'true' &&
      needs.approve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      merge_result: ${{ steps.merge-pull-request.outputs.mergeResult }}
    steps:
      - name: Create ephemeral GitHub token (configured policy)
        id: create-token-explicit
        if: ${{ inputs.shared-token-policy != '' }}
        uses: elastic/oblt-actions/github/create-token@v1
        with:
          token-policy: ${{ inputs.shared-token-policy }}

      - id: merge-pull-request
        name: Merge pull request when ready (squash)
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          GITHUB_TOKEN: ${{ steps.create-token-explicit.outputs.token || secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          MERGE_LABELS: "oblt-aw/ai/merge-ready"
          UPDATE_LABELS: "oblt-aw/ai/merge-ready"
          MERGE_METHOD: squash
          MERGE_FORKS: "false"
          MERGE_DELETE_BRANCH: "true"
          MERGE_REQUIRED_APPROVALS: "1"
          # Short retry only: long CI is handled by obs-aw-automerge-deferred on frequent schedule.
          MERGE_RETRIES: "3"
          MERGE_RETRY_SLEEP: "15000"

  # When direct merge is not ready (pending checks / merge queue), arm for deferred merge.
  # Deferred path is Vault REST on the frequent schedule profile (bypass actor).
  arm-for-deferred-merge:
    needs: [automerge]
    if: >-
      always() &&
      (needs.automerge.outputs.merge_result == 'merge_failed' ||
       needs.automerge.outputs.merge_result == 'not_ready')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      armed: ${{ steps.arm.outputs.armed }}
    steps:
      - name: Checkout elastic/oblt-aw (armed marker helpers)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            scripts/obs/automerge_armed_lib.sh
          sparse-checkout-cone-mode: false

      - name: Create ephemeral GitHub token (configured policy)
        id: create-token-explicit
        if: ${{ inputs.shared-token-policy != '' }}
        uses: elastic/oblt-actions/github/create-token@v1
        with:
          token-policy: ${{ inputs.shared-token-policy }}

      - name: Retry direct REST merge once
        id: rest-retry
        env:
          GH_TOKEN: ${{ steps.create-token-explicit.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # shellcheck source=../../../scripts/obs/automerge_armed_lib.sh
          source _oblt-aw/scripts/obs/automerge_armed_lib.sh
          if merge_out="$(gh api --method PUT "repos/${REPO}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="${HEAD_SHA}" 2>&1)"; then
            echo "Merged via REST API."
            echo "merged=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "REST merge error: ${merge_out}"
          if automerge_merge_error_is_already_merged_message "${merge_out}"; then
            echo "merged=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if printf '%s' "${merge_out}" | grep -qiE 'pull request is not open'; then
            pr_state="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json state -q .state)"
            if [[ "${pr_state}" == "MERGED" ]]; then
              echo "merged=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "PR not open and not MERGED (state=${pr_state}); failing."
            exit 1
          fi
          if automerge_merge_error_is_pending_checks "${merge_out}"; then
            echo "merged=false" >> "${GITHUB_OUTPUT}"
            echo "REST merge blocked by pending checks (will arm for deferred merge)."
            exit 0
          fi
          echo "REST merge failed with a non-retryable error; not arming."
          exit 1

      - name: Upsert armed comment for deferred merge
        id: arm
        if: steps.rest-retry.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHARED_TOKEN_POLICY: ${{ inputs.shared-token-policy }}
        run: |
          set -euo pipefail
          # shellcheck source=../../../scripts/obs/automerge_armed_lib.sh
          source _oblt-aw/scripts/obs/automerge_armed_lib.sh
          automerge_upsert_armed_comment "${REPO}" "${PR_NUMBER}" "${HEAD_SHA}" "${RUN_URL}" "${SHARED_TOKEN_POLICY}"

  # Success when merged now, not_ready (deferred), or armed for deferred merge.
  report-automerge-outcome:
    needs:
      - verify
      - check-dependency-collection
      - automerge
      - arm-for-deferred-merge
    if: >-
      always() &&
      needs.verify.outputs.proceed == 'true' &&
      needs.check-dependency-collection.outputs.allowed == 'true' &&
      needs.automerge.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout elastic/oblt-aw (armed marker helpers)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            scripts/obs/automerge_armed_lib.sh
          sparse-checkout-cone-mode: false

      - name: Report outcome (soft-succeed when not ready; fail only on permanent blockers)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_RESULT: ${{ needs.automerge.outputs.merge_result }}
          ARM_RESULT: ${{ needs.arm-for-deferred-merge.result }}
          ARMED: ${{ needs.arm-for-deferred-merge.outputs.armed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHARED_TOKEN_POLICY: ${{ inputs.shared-token-policy }}
        run: |
          set -euo pipefail
          # shellcheck source=../../../scripts/obs/automerge_armed_lib.sh
          source _oblt-aw/scripts/obs/automerge_armed_lib.sh

          fail_with_comment() {
            local detail="$1"
            MARKER='<!-- obs-aw-automerge:outcome-gate -->'
            body="$(printf '%s\n\n%s\n\n%s\n\n%s' \
              "$MARKER" \
              "Automerge could not complete for this pull request." \
              "${detail}" \
              "Workflow run: ${RUN_URL}")"
            comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              | jq --arg marker "$MARKER" -r '.[] | select(.body | contains($marker)) | .id' \
              | head -n 1)"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="$body" >/dev/null
            else
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"
            fi
            echo "Automerge pipeline finished without merging or arming PR #${PR_NUMBER} (mergeResult=${MERGE_RESULT:-unknown}, arm=${ARM_RESULT}, armed=${ARMED})."
            exit 1
          }

          if [ "${MERGE_RESULT}" = "merged" ]; then
            echo "PR merged by automerge action."
            exit 0
          fi

          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state)"
          pr_state="$(printf '%s' "$pr_json" | jq -r .state)"
          if [ "$pr_state" = "MERGED" ]; then
            echo "PR is merged; treating as success."
            exit 0
          fi

          if [ "${ARM_RESULT}" = "success" ] && [ "${ARMED}" = "true" ]; then
            echo "PR armed for deferred merge when required checks succeed."
            exit 0
          fi

          # Arm job may have merged via REST retry without setting armed=true.
          if [ "${ARM_RESULT}" = "success" ] && [ "${ARMED}" != "true" ]; then
            pr_json2="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state)"
            if [ "$(printf '%s' "$pr_json2" | jq -r .state)" = "MERGED" ]; then
              echo "PR merged during arm REST retry."
              exit 0
            fi
          fi

          # not_ready soft-succeeds only when arming succeeded or we can still upsert
          # after a successful arm path. Never hide a permanent REST/arm failure.
          if [ "${MERGE_RESULT}" = "not_ready" ]; then
            if [ "${ARM_RESULT}" = "failure" ]; then
              echo "mergeResult=not_ready but arm-for-deferred-merge failed (non-retryable); failing."
              exit 1
            fi
            automerge_upsert_armed_comment "${REPO}" "${PR_NUMBER}" "${HEAD_SHA}" "${RUN_URL}" "${SHARED_TOKEN_POLICY}"
            echo "PR not ready (pending checks); commented and soft-succeeding for deferred retry."
            exit 0
          fi

          fail_with_comment "A repository rule or required check is still blocking the merge. Check the linked workflow run for details, or ask a maintainer to merge this pull request manually."
