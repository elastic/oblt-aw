name: Automerge
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-prelude.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
      shared-enabled-workflows:
        description: Normalized JSON array of compound workflow ids from aw-prelude.
        required: true
        type: string
# Nested GH-AW autoapprove: empty github-token-policy → GITHUB_TOKEN for most
# authors; Vault only when author is github-actions[bot] (avoid self-APPROVE).
# Merge jobs mint OIDC ephemeral tokens when shared-token-policy is non-empty.
permissions:
  contents: read

jobs:

  # Single PR from github.event.pull_request. PR fields only (pull_request trigger).
  verify:
    if: inputs.shared-proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.validate.outputs.proceed }}
    steps:
      - name: Checkout elastic/oblt-aw (automerge verify only)
        uses: actions/checkout@v7
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            config/obs/allowed_pr_authors.json
            scripts/obs/validateAutomergePr.ts
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: _oblt-aw/package-lock.json

      - name: Install npm dependencies
        working-directory: _oblt-aw
        run: npm ci

      - name: Validate pull request for automerge
        id: validate
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHARED_TOKEN_POLICY: ${{ inputs.shared-token-policy }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require('node:path');
            const { createRequire } = require('node:module');
            const root = path.join(process.env.GITHUB_WORKSPACE, '_oblt-aw');
            const rq = createRequire(path.join(root, 'package.json'));
            rq('tsx/cjs/api').register();
            const { run } = rq('./scripts/obs/validateAutomergePr.ts');
            const prNumber = parseInt(process.env.PR_NUMBER || '', 10);
            const { ok } = await run({
              github,
              context,
              prNumber,
              core,
              sharedTokenPolicy: process.env.SHARED_TOKEN_POLICY || '',
            });
            core.setOutput('proceed', ok ? 'true' : 'false');

  # Classify dependency updates by changed file paths (no extra labels in consumer repos).
  # Posts a single PR comment when the collection is inactive, ambiguous, or unclassified.
  check-dependency-collection:
    needs: verify
    if: inputs.shared-proceed == 'true' && needs.verify.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      allowed: ${{ steps.check-collection.outputs.allowed }}
      collection-id: ${{ steps.check-collection.outputs.collection-id }}
    steps:
      - name: Checkout elastic/oblt-aw (dependency collection gate only)
        uses: actions/checkout@v7
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            config/obs/automerge-dependency-collections.json
            scripts/obs/checkAutomergeDependencyCollection.ts
            scripts/obs/classifyAutomergeDependencyCollection.ts
            scripts/obs/lib/matchPathGlob.ts
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: _oblt-aw/package-lock.json

      - name: Install npm dependencies
        working-directory: _oblt-aw
        run: npm ci

      - name: Check dependency collection for automerge
        id: check-collection
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ENABLED_WORKFLOWS_JSON: ${{ inputs.shared-enabled-workflows }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require('node:path');
            const { createRequire } = require('node:module');
            const root = path.join(process.env.GITHUB_WORKSPACE, '_oblt-aw');
            const rq = createRequire(path.join(root, 'package.json'));
            rq('tsx/cjs/api').register();
            const { run } = rq('./scripts/obs/checkAutomergeDependencyCollection.ts');
            const prNumber = parseInt(process.env.PR_NUMBER || '', 10);
            const { allowed, collectionId } = await run({
              github,
              context,
              prNumber,
              core,
              enabledWorkflowsJson: process.env.ENABLED_WORKFLOWS_JSON || '[]',
            });
            core.setOutput('allowed', allowed ? 'true' : 'false');
            core.setOutput('collection-id', collectionId || '');

  # Approve identity must differ from the PR author (GitHub rejects self-APPROVE).
  # Default: GITHUB_TOKEN (github-actions[bot]). When the author is github-actions[bot],
  # pass shared-token-policy so the nested lock mints Vault. Merge still uses Vault when
  # shared-token-policy is set. Automerge continues via needs (no re-trigger for the review).
  resolve-apm-assets:
    needs: [verify, check-dependency-collection]
    if: >-
      inputs.shared-proceed == 'true' &&
      needs.verify.outputs.proceed == 'true' &&
      needs.check-dependency-collection.outputs.allowed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-automerge.yml
      # Approve gates live in gh-aw-autoapprove.md. Resolve only merges consumer APM fragments.

  approve:
    needs: [verify, check-dependency-collection, resolve-apm-assets]
    if: >-
      inputs.shared-proceed == 'true' &&
      needs.verify.outputs.proceed == 'true' &&
      needs.check-dependency-collection.outputs.allowed == 'true'
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      copilot-requests: write
      # Callee lock always declares id-token: write (mint is skipped when policy is empty).
      id-token: write
    # Relative so client @v0 / control-plane tip pins inherit the release train.
    uses: ./.github/workflows/gh-aw-autoapprove.lock.yml
    with:
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
      # fromJSON('"\n"') yields a real newline; '\n' is two literal characters in GHA expressions.
      setup-commands: ${{ join(fromJSON(needs.resolve-apm-assets.outputs.resolved-setup-commands-json), fromJSON('"\n"')) }}
      # Empty → GITHUB_TOKEN; non-empty only when author is github-actions[bot] (avoid self-APPROVE).
      github-token-policy: ${{ github.event.pull_request.user.login == 'github-actions[bot]' && inputs.shared-token-policy || '' }}
      # Bots + allow list are hardcoded on the in-repo lock. Failure-issue suppression from obs-defaults.

  # Fail closed: approve job success alone is not enough — require a real APPROVED review
  # for the live head (COMMENT-only "eligible" must not reach merge).
  assert-approved-review:
    needs:
      - verify
      - check-dependency-collection
      - approve
    if: >-
      always() &&
      !cancelled() &&
      inputs.shared-proceed == 'true' &&
      needs.verify.outputs.proceed == 'true' &&
      needs.check-dependency-collection.outputs.allowed == 'true' &&
      needs.approve.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.assert.outputs.head_sha }}
      reason: ${{ steps.assert.outputs.reason }}
    steps:
      - name: Checkout elastic/oblt-aw (approval assert)
        uses: actions/checkout@v7
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            scripts/obs/assert_automerge_approved_review.sh
          sparse-checkout-cone-mode: false

      - name: Require non-author APPROVED review for live head SHA
        id: assert
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # shellcheck source=../../../scripts/obs/assert_automerge_approved_review.sh
          source _oblt-aw/scripts/obs/assert_automerge_approved_review.sh
          live_sha="$(automerge_fetch_pr_head_sha "${REPO}" "${PR_NUMBER}")" || {
            echo "reason=verify_failed" >> "${GITHUB_OUTPUT}"
            echo "head_sha=${EVENT_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
            exit 1
          }
          echo "head_sha=${live_sha}" >> "${GITHUB_OUTPUT}"
          if [[ "${live_sha}" != "${EVENT_HEAD_SHA}" ]]; then
            echo "reason=stale_head" >> "${GITHUB_OUTPUT}"
            echo "PR head moved since the workflow event (live=${live_sha} event=${EVENT_HEAD_SHA}); failing closed." >&2
            exit 1
          fi
          set +e
          assert_out="$(automerge_assert_pr_has_approved_review \
            "${REPO}" "${PR_NUMBER}" "${PR_AUTHOR}" "${live_sha}" 2>&1)"
          assert_rc=$?
          set -e
          printf '%s\n' "${assert_out}"
          reason="$(printf '%s\n' "${assert_out}" | sed -n 's/^ASSERT_REASON=//p' | tail -n 1)"
          if [[ -z "${reason}" ]]; then
            if [[ "${assert_rc}" -eq 2 ]]; then
              reason=missing_approval
            elif [[ "${assert_rc}" -eq 0 ]]; then
              reason=ok
            else
              reason=verify_failed
            fi
          fi
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          if [[ "${assert_rc}" -ne 0 ]]; then
            exit 1
          fi

  # When shared-token-policy is set, merge as the Vault app (ephemeral token) so repo
  # pull_request_bypassers for that app can skip CODEOWNERS. Otherwise use GITHUB_TOKEN.
  # Primary merge is SHA-bound REST (asserted head only) — no branch update / live-head
  # rewrite between approval assert and merge. Author/label rules are in `verify`.
  automerge:
    needs:
      - verify
      - check-dependency-collection
      - approve
      - assert-approved-review
    if: >-
      always() &&
      !cancelled() &&
      inputs.shared-proceed == 'true' &&
      needs.verify.outputs.proceed == 'true' &&
      needs.check-dependency-collection.outputs.allowed == 'true' &&
      needs.approve.result == 'success' &&
      needs.assert-approved-review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      merge_result: ${{ steps.merge-pull-request.outputs.mergeResult }}
      merge_assert_reason: ${{ steps.merge-pull-request.outputs.assertReason }}
      head_sha: ${{ needs.assert-approved-review.outputs.head_sha }}
    steps:
      - name: Checkout elastic/oblt-aw (SHA-bound merge helpers)
        uses: actions/checkout@v7
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            scripts/obs/assert_automerge_approved_review.sh
            scripts/obs/automerge_armed_lib.sh
          sparse-checkout-cone-mode: false

      - name: Create ephemeral GitHub token (configured policy)
        id: create-token-explicit
        if: ${{ inputs.shared-token-policy != '' }}
        uses: elastic/oblt-actions/github/create-token@v1
        with:
          token-policy: ${{ inputs.shared-token-policy }}

      - id: merge-pull-request
        name: Squash-merge at asserted head SHA
        env:
          GH_TOKEN: ${{ steps.create-token-explicit.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSERTED_SHA: ${{ needs.assert-approved-review.outputs.head_sha }}
        run: |
          set -euo pipefail
          # shellcheck source=../../../scripts/obs/assert_automerge_approved_review.sh
          source _oblt-aw/scripts/obs/assert_automerge_approved_review.sh
          # shellcheck source=../../../scripts/obs/automerge_armed_lib.sh
          source _oblt-aw/scripts/obs/automerge_armed_lib.sh
          set +e
          merge_out="$(automerge_squash_merge_at_sha \
            "${REPO}" "${PR_NUMBER}" "${ASSERTED_SHA}" "${PR_AUTHOR}" 2>&1)"
          merge_rc=$?
          set -e
          printf '%s\n' "${merge_out}"
          result="$(printf '%s\n' "${merge_out}" | sed -n 's/^MERGE_RESULT=//p' | tail -n 1)"
          assert_reason="$(printf '%s\n' "${merge_out}" | sed -n 's/^ASSERT_REASON=//p' | tail -n 1)"
          if [[ -z "${result}" ]]; then
            if [[ "${merge_rc}" -eq 0 ]]; then
              result=merged
            else
              result=merge_failed
            fi
          fi
          echo "mergeResult=${result}" >> "${GITHUB_OUTPUT}"
          echo "assertReason=${assert_reason}" >> "${GITHUB_OUTPUT}"
          if [[ "${merge_rc}" -ne 0 ]]; then
            exit 1
          fi

  # When primary SHA-bound merge did not land, one more Vault REST attempt.
  # Skip when merge-time revalidation already proved approval missing / unverifiable
  # (retry would only re-emit the same reason and confuse outcome messaging).
  # Pending checks → soft-succeed so arm-for-deferred-merge can mark the PR; other errors fail.
  rest-merge:
    needs: [automerge, assert-approved-review]
    if: >-
      always() &&
      (needs.automerge.outputs.merge_result == 'merge_failed' ||
       needs.automerge.outputs.merge_result == 'not_ready') &&
      needs.automerge.outputs.merge_assert_reason != 'missing_approval' &&
      needs.automerge.outputs.merge_assert_reason != 'verify_failed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      merge_assert_reason: ${{ steps.merge.outputs.assertReason }}
    steps:
      - name: Checkout elastic/oblt-aw (REST error helpers)
        uses: actions/checkout@v7
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            scripts/obs/assert_automerge_approved_review.sh
            scripts/obs/automerge_armed_lib.sh
          sparse-checkout-cone-mode: false

      - name: Create ephemeral GitHub token (configured policy)
        id: create-token-explicit
        if: ${{ inputs.shared-token-policy != '' }}
        uses: elastic/oblt-actions/github/create-token@v1
        with:
          token-policy: ${{ inputs.shared-token-policy }}

      - name: Squash-merge via REST once
        id: merge
        env:
          GH_TOKEN: ${{ steps.create-token-explicit.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.assert-approved-review.outputs.head_sha }}
        run: |
          set -euo pipefail
          # shellcheck source=../../../scripts/obs/assert_automerge_approved_review.sh
          source _oblt-aw/scripts/obs/assert_automerge_approved_review.sh
          # shellcheck source=../../../scripts/obs/automerge_armed_lib.sh
          source _oblt-aw/scripts/obs/automerge_armed_lib.sh
          set +e
          merge_out="$(automerge_squash_merge_at_sha \
            "${REPO}" "${PR_NUMBER}" "${HEAD_SHA}" "${PR_AUTHOR}" 2>&1)"
          set -e
          printf '%s\n' "${merge_out}"
          result="$(printf '%s\n' "${merge_out}" | sed -n 's/^MERGE_RESULT=//p' | tail -n 1)"
          assert_reason="$(printf '%s\n' "${merge_out}" | sed -n 's/^ASSERT_REASON=//p' | tail -n 1)"
          echo "assertReason=${assert_reason}" >> "${GITHUB_OUTPUT}"
          if [[ "${result}" == "merged" ]]; then
            echo "merged=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${result}" == "not_ready" ]]; then
            echo "merged=false" >> "${GITHUB_OUTPUT}"
            echo "REST merge blocked by pending checks (will arm for deferred merge)."
            exit 0
          fi
          echo "merged=false" >> "${GITHUB_OUTPUT}"
          exit 1

  # After rest-merge soft-succeeds on pending checks, upsert the SHA-bound armed comment.
  arm-for-deferred-merge:
    needs: [rest-merge, assert-approved-review]
    if: >-
      always() &&
      needs.rest-merge.result == 'success' &&
      needs.rest-merge.outputs.merged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      armed: ${{ steps.arm.outputs.armed }}
    steps:
      - name: Checkout elastic/oblt-aw (armed marker helpers)
        uses: actions/checkout@v7
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            scripts/obs/automerge_armed_lib.sh
          sparse-checkout-cone-mode: false

      - name: Upsert armed comment for deferred merge
        id: arm
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.assert-approved-review.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHARED_TOKEN_POLICY: ${{ inputs.shared-token-policy }}
        run: |
          set -euo pipefail
          # shellcheck source=../../../scripts/obs/automerge_armed_lib.sh
          source _oblt-aw/scripts/obs/automerge_armed_lib.sh
          automerge_upsert_armed_comment "${REPO}" "${PR_NUMBER}" "${HEAD_SHA}" "${RUN_URL}" "${SHARED_TOKEN_POLICY}"

  # Success when merged now, not_ready (deferred), or armed for deferred merge.
  # Also runs when assert-approved-review failed (automerge skipped) so the PR gets
  # an accurate missing-APPROVE comment instead of a silent skip.
  report-automerge-outcome:
    needs:
      - verify
      - check-dependency-collection
      - assert-approved-review
      - automerge
      - rest-merge
      - arm-for-deferred-merge
    if: >-
      always() &&
      needs.verify.outputs.proceed == 'true' &&
      needs.check-dependency-collection.outputs.allowed == 'true' &&
      (needs.assert-approved-review.result == 'failure' ||
       needs.automerge.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout elastic/oblt-aw (armed marker helpers)
        uses: actions/checkout@v7
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            scripts/obs/assert_automerge_approved_review.sh
            scripts/obs/automerge_armed_lib.sh
          sparse-checkout-cone-mode: false

      - name: Report outcome (soft-succeed when not ready; fail only on permanent blockers)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ needs.assert-approved-review.outputs.head_sha || github.event.pull_request.head.sha }}
          ASSERT_RESULT: ${{ needs.assert-approved-review.result }}
          ASSERT_REASON: ${{ needs.assert-approved-review.outputs.reason }}
          MERGE_RESULT: ${{ needs.automerge.outputs.merge_result }}
          # Prefer rest-merge reason when present so primary not_ready/ok cannot
          # mask a later missing_approval or verify_failed from the fallback.
          MERGE_ASSERT_REASON: ${{ needs.rest-merge.outputs.merge_assert_reason || needs.automerge.outputs.merge_assert_reason }}
          REST_RESULT: ${{ needs.rest-merge.result }}
          REST_MERGED: ${{ needs.rest-merge.outputs.merged }}
          ARM_RESULT: ${{ needs.arm-for-deferred-merge.result }}
          ARMED: ${{ needs.arm-for-deferred-merge.outputs.armed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHARED_TOKEN_POLICY: ${{ inputs.shared-token-policy }}
        run: |
          set -euo pipefail
          # shellcheck source=../../../scripts/obs/assert_automerge_approved_review.sh
          source _oblt-aw/scripts/obs/assert_automerge_approved_review.sh
          # shellcheck source=../../../scripts/obs/automerge_armed_lib.sh
          source _oblt-aw/scripts/obs/automerge_armed_lib.sh

          fail_with_comment() {
            local detail="$1"
            MARKER='<!-- obs-aw-automerge:outcome-gate -->'
            body="$(printf '%s\n\n%s\n\n%s\n\n%s' \
              "$MARKER" \
              "Automerge could not complete for this pull request." \
              "${detail}" \
              "Workflow run: ${RUN_URL}")"
            comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
              | jq --arg marker "$MARKER" -r '.[] | select(.body | contains($marker)) | .id' \
              | head -n 1)"
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="$body" >/dev/null
            else
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"
            fi
            echo "Automerge pipeline finished without merging or arming PR #${PR_NUMBER} (mergeResult=${MERGE_RESULT:-unknown}, rest=${REST_RESULT}, merged=${REST_MERGED}, arm=${ARM_RESULT}, armed=${ARMED})."
            exit 1
          }

          missing_approve_detail="Missing APPROVE review: automerge requires a non-author GitHub review with state APPROVED for the current head (COMMENT-only eligibility is not enough). Re-run after the approve step submits event=APPROVE, or ask a maintainer to approve and merge manually."
          verify_failed_detail="Could not verify APPROVE review (checkout, API, or head-SHA lookup failed). Check the linked workflow run; do not assume approval is missing."
          stale_head_detail="PR head moved since this workflow event; approval was not re-checked for the new head. Re-run automerge on the current head, or ask a maintainer to merge manually."

          fail_on_assert_reason() {
            case "${1:-}" in
              missing_approval)
                fail_with_comment "${missing_approve_detail}"
                ;;
              stale_head)
                fail_with_comment "${stale_head_detail}"
                ;;
              verify_failed)
                fail_with_comment "${verify_failed_detail}"
                ;;
              *)
                return 1
                ;;
            esac
          }

          if [ "${ASSERT_RESULT}" = "failure" ]; then
            fail_on_assert_reason "${ASSERT_REASON}" || fail_with_comment "${verify_failed_detail}"
          fi

          if [ "${MERGE_RESULT}" = "merged" ]; then
            echo "PR merged by automerge action."
            exit 0
          fi

          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state)"
          pr_state="$(printf '%s' "$pr_json" | jq -r .state)"
          if [ "$pr_state" = "MERGED" ]; then
            echo "PR is merged; treating as success."
            exit 0
          fi

          if [ "${REST_RESULT}" = "success" ] && [ "${REST_MERGED}" = "true" ]; then
            echo "PR merged by rest-merge."
            exit 0
          fi

          if [ "${ARM_RESULT}" = "success" ] && [ "${ARMED}" = "true" ]; then
            echo "PR armed for deferred merge when required checks succeed."
            exit 0
          fi

          # Merge-time revalidation (approval dismissed / review API failed after
          # assert-approved-review) — do not blame repository rules or required checks.
          if fail_on_assert_reason "${MERGE_ASSERT_REASON:-}"; then
            :
          fi

          # Permanent REST failure (CODEOWNERS, rules, etc.) — do not soft-succeed.
          if [ "${REST_RESULT}" = "failure" ]; then
            fail_with_comment "REST merge failed with a non-retryable repository rule or required-check blocker (for example CODEOWNERS without Vault bypass). Check the linked workflow run for details, or ask a maintainer to merge this pull request manually."
          fi

          # not_ready soft-succeeds only when arming succeeded or we can still upsert
          # after a successful rest-merge pending path. Never hide a permanent REST/arm failure.
          if [ "${MERGE_RESULT}" = "not_ready" ]; then
            if [ "${ARM_RESULT}" = "failure" ]; then
              echo "mergeResult=not_ready but arm-for-deferred-merge failed; failing."
              exit 1
            fi
            automerge_upsert_armed_comment "${REPO}" "${PR_NUMBER}" "${HEAD_SHA}" "${RUN_URL}" "${SHARED_TOKEN_POLICY}"
            echo "PR not ready (pending checks); commented and soft-succeeding for deferred retry."
            exit 0
          fi

          # Primary merge skipped (e.g. merge-ready label removed after verify) —
          # do not merge/arm; soft-succeed when an APPROVED review still exists.
          if [ "${MERGE_RESULT}" = "skipped" ]; then
            if ! reviews_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate)"; then
              fail_with_comment "${verify_failed_detail}"
            fi
            if ! automerge_reviews_have_non_author_approval \
              "${reviews_json}" "${PR_AUTHOR}" "${HEAD_SHA}"; then
              fail_with_comment "${missing_approve_detail}"
            fi
            echo "Automerge skipped (mergeResult=skipped); not merging or arming."
            exit 0
          fi

          fail_with_comment "A repository rule or required check is still blocking the merge. Check the linked workflow run for details, or ask a maintainer to merge this pull request manually."
