name: Observability Agentic Workflow — Automerge Schedule

# In-repo mirror of the distributed client template.
# Dedicated schedule for armed automerge completion (every 30 minutes).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-obs-aw-automerge-schedule:
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/obs-aw-event-automerge-schedule.yml@main # ratchet:exclude
