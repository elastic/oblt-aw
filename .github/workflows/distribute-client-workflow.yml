name: Distribute Client Workflow

# Deprecated monolith entrypoint. Org-scoped workflows own OIDC TokenPolicies:
#   distribute-client-workflow-obs.yml
#   distribute-client-workflow-security.yml

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/distribute-client-workflow.yml
  workflow_dispatch:
    inputs:
      force:
        description: Unused on the legacy entrypoint; run org-scoped distribute workflows instead
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: distribute-client-workflow-legacy
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point operators at org-scoped distribute workflows
        run: |
          {
            echo "## Deprecated entrypoint"
            echo
            echo "Use these workflows instead (unique workflow_ref per Backstage org):"
            echo
            echo "- \`distribute-client-workflow-obs.yml\`"
            echo "- \`distribute-client-workflow-security.yml\`"
            echo
            echo "This legacy workflow no longer mints tokens or opens distribute PRs."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Legacy distribute-client-workflow.yml is a no-op; use org-scoped distribute workflows."
