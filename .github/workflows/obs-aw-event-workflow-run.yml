name: Observability Agentic Workflow — Workflow Run Event

# Event-scoped orchestrator for failed GitHub Actions workflow runs on PRs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  run-aw-prelude:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/aw-prelude.yml
    with:
      control-plane-workflows: '["obs-aw-pr-actions-detective.yml"]'
      load-allowed-authors: false

  pr-actions-detective:
    needs: run-aw-prelude
    if: >-
      fromJSON(needs.run-aw-prelude.outputs.proceed-by-workflow)['obs-aw-pr-actions-detective.yml'] == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      toJSON(github.event.workflow_run.pull_requests) != '[]'
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/obs-aw-pr-actions-detective.yml
    with:
      shared-proceed: ${{ fromJSON(needs.run-aw-prelude.outputs.proceed-by-workflow)['obs-aw-pr-actions-detective.yml'] }}
