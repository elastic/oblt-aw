name: Security Issue Fixer
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-prelude.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
# Nested GH-AW jobs mint OIDC ephemeral tokens when github-token-policy is non-empty.
permissions:
  contents: read

jobs:

  load-issue-context:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      (
        (github.event.label.name == 'oblt-aw/ai/fix-ready' && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/triage/security-')) ||
        (startsWith(github.event.label.name, 'oblt-aw/triage/security-') && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/ai/fix-ready'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      snapshot: ${{ steps.build.outputs.snapshot }}
    steps:
      - name: Checkout oblt-aw (snapshot script)
        uses: actions/checkout@v7
        with:
          repository: elastic/oblt-aw
          ref: ${{ github.repository == 'elastic/oblt-aw' && github.sha || 'main' }}
          path: _oblt-aw
          fetch-depth: 1
          sparse-checkout: |
            scripts/obs/build-fixer-issue-snapshot.sh
      - name: Build issue snapshot for fixer prompt
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: _oblt-aw/scripts/obs/build-fixer-issue-snapshot.sh "$ISSUE_NUMBER"

  resolve-apm-assets:
    needs: [load-issue-context]
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      (
        (github.event.label.name == 'oblt-aw/ai/fix-ready' && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/triage/security-')) ||
        (startsWith(github.event.label.name, 'oblt-aw/triage/security-') && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/ai/fix-ready'))
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-security-fixer.yml
      # Shared draft/review/merge policy + GitHub-read/safe-output contract:
      # config/obs/instruction-fragments/ via instruction-fragment-map.json
      # (workflows.security.inner-workflows).
      platform-additional-instructions: |
        Your task is to fix security issues labeled for remediation. This workflow uses agentic workflows from elastic/ai-github-actions.

        **Execution Preconditions:**
        - This run was already gated by workflow `if:` for labels:
          - `oblt-aw/ai/fix-ready`
          - At least one of `oblt-aw/triage/security-injection`, `oblt-aw/triage/security-secrets`, `oblt-aw/triage/security-supply-chain`, `oblt-aw/triage/security-least-privilege`
        - Do **not** refuse solely because shell `gh` cannot re-check those labels.
        - The issue must already contain a triage-generated resolution plan (see the issue snapshot below and/or issue comments).

        **Implementation Workflow (sequential and methodical):**
        1. Read the resolution plan from the issue snapshot below (or via GitHub MCP / `github` CLI if you need more detail) and extract ordered tasks.
        2. Execute the plan strictly step by step, without skipping steps.
        3. For each step, document what changed and why in commit messages and PR description.
        4. **Least-privilege (MANDATORY):** Grant only the minimum permissions required. Never add broad scopes (e.g., avoid `contents: write` when `contents: read` suffices). Prefer job-level permissions over workflow-root permissions.
        5. **Env-indirection (MANDATORY):** Never interpolate secrets or tokens directly in command strings. Always pass them via `env:` blocks (e.g. env: TOKEN: <secret-ref>; run: ./script.sh). Never interpolate secrets in run: command strings.
        6. Run validation/tests described in the plan and confirm the vulnerability is remediated.

        **Pull Request Requirements:**
        - Create a pull request in `Draft` state first.
        - PR title should reference fixing the security issue (e.g., "[oblt-aw][security] Fix token exposure in workflow X").
        - PR body must include:
          - `Closes #<issue-number>` at the top to link and auto-close the source issue on merge
          - checklist of plan steps completed
          - evidence of successful tests/validation
          - explicit confirmation that least-privilege and env-indirection patterns were applied

        ${{ needs.load-issue-context.outputs.snapshot }}

  security-issue-fixer:
    needs: [resolve-apm-assets]
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
      copilot-requests: write
      id-token: write
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      (
        (github.event.label.name == 'oblt-aw/ai/fix-ready' && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/triage/security-')) ||
        (startsWith(github.event.label.name, 'oblt-aw/triage/security-') && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/ai/fix-ready'))
      )
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-issue-fixer.lock.yml@main
    with:
      allowed-bot-users: ${{ inputs.shared-allowed-issue-authors-csv }}
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
      github-token-policy: ${{ inputs.shared-token-policy }}
    secrets: inherit

  request-reviewers:
    needs: security-issue-fixer
    if: needs.security-issue-fixer.outputs.created_pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request review from elastic/observablt-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.security-issue-fixer.outputs.created_pr_number }}
        run: gh pr edit "$PR_NUMBER" --add-reviewer "elastic/observablt-ci" --repo "$GITHUB_REPOSITORY"

  notify-no-pr:
    needs: security-issue-fixer
    if: >-
      always() &&
      needs.security-issue-fixer.result == 'success' &&
      needs.security-issue-fixer.outputs.created_pr_number == ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on source issue when fixer opened no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Security issue fixer finished without opening a pull request."
            echo
            echo "- Workflow run: ${RUN_URL}"
            echo "- If the agent intentionally called \`noop\` / \`report_incomplete\`, treat that as the completion signal."
            echo "- If you expected a PR, check the run artifacts for empty safe outputs and any \`[aw] Issue Fixer produced no safe outputs\` meta-issue."
            echo
            echo "To retry after a false bailout: remove and re-apply \`oblt-aw/ai/fix-ready\` (keep a \`oblt-aw/triage/security-*\` label)."
          } | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
