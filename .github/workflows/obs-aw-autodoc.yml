name: Automated Documentation Analysis and Improvement
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-prelude.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
permissions:
  contents: read

jobs:

  # Step 1: Detect docs drift from recent code changes and create an issue with findings
  resolve-apm-assets-audit:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-autodoc.yml
      platform-additional-instructions: |
        Your task is to analyze ALL documentation in this repository, identify gaps and areas for improvement, and file an issue with concrete findings.

        Do NOT search for open issues. Instead, perform a direct documentation audit of this repository.

        **What to look for (in priority order):**
        1. **Undocumented or partially documented code** — features, scripts, workflows, or configuration files that are not covered (or only partially covered) in the repository's documentation; for each gap found, specify which files to add or expand to describe purpose, parameters, behavior, and usage examples
        2. **Empty or missing files** — files that exist but contain no meaningful content
        3. **Missing sections** — key README sections absent such as purpose, usage, inputs, outputs, examples, or contributing guidance
        4. **Outdated content** — references to components, configurations, or capabilities no longer present or not yet documented
        5. **Incomplete descriptions** — sections that exist but lack meaningful detail (stubs, TODOs, placeholder text)
        6. **Broken cross-references** — links to files, workflows, or sections that do not exist in the repository
        7. **Inconsistencies** — documentation that contradicts the actual source files in the repository

        **Secret documentation:** When proposing documentation about secret definitions or usage, follow the Observability org rules encoded here. Do **not** attempt to read private repositories (including [`elastic/observability-github-secrets`](https://github.com/elastic/observability-github-secrets)) via GitHub tools or MCP. Ground secret-related findings only in these rules and in what is already documented in the target repository:
        - Prefer ephemeral GitHub tokens (`elastic/oblt-actions/github/create-token`) and catalog TokenPolicy over long-lived repository secrets when that pattern applies.
        - Do not recommend provisioning secrets only via GitHub **Settings → Secrets** unless the repository's own docs already document that exception.
        - When long-lived Action secrets are required, tell readers to provision them through [`elastic/observability-github-secrets`](https://github.com/elastic/observability-github-secrets) per org process; do not invent alternate provisioning procedures.
        - Use exact secret names from the repository's workflow documentation when present; do not invent secret names or procedures.

        **False positives to avoid when reporting findings:**
        - **Markdown tables** — A leading `-` (or similar punctuation) inside a table cell can be intentional (for example as a lightweight icon or status marker, not a broken nested list). Do not flag these as formatting defects unless you can show they break rendering or contradict repository conventions.
        - **Markdown link fragments / anchors** — Preserve existing link fragments (the `#...` part) unless heading verification proves a correction is required. Do not “normalize” anchors based on style preferences alone. This includes icon-prefixed headings where the computed slug intentionally starts with `-`: the `-` character is a valid replacement for a leading icon in the heading text and therefore a valid part of the anchor slug. For example, rewriting `[Lab 01: Troubleshooting](01-installation-setup.md#-troubleshooting-quick-reference)` to `[Lab 01: Troubleshooting](01-installation-setup.md#troubleshooting-quick-reference)` is invalid when the verified heading slug is `#-troubleshooting-quick-reference`.
        - **Auto-generated documentation** — Files produced or overwritten by generators, templates, or sync jobs (banners such as “do not edit”, “generated by”, `AUTO-GENERATED`, paths listed only in codegen output, etc.) should not be the target of hand-edited “doc fixes”. Instead, call out the real source (script, template, OpenAPI/spec, upstream package) or the automation that should change, or state that the fix belongs outside the repo.
        - **Legacy inline comments** — Comments that explain past incidents, migrations, or non-obvious rationale may still be worth keeping for context even when nearby prose is refreshed. Prefer “update in place” or a short clarifying suffix over recommending deletion when the history remains accurate or useful.
        - **AI assets / agent configuration files** — Do not propose changes to AI-related assets. Treat AI assets, skills files, instruction/configuration files, and lock files (for example `*.lock*` and `*.lock.yml`) as strictly out of scope for autodoc findings.
        - **Helm chart internals** — Do not propose changes to Helm chart internal files. Treat template files (`helm-charts/**/templates/**`), notes files (`helm-charts/**/NOTES.txt`), and any markdown files under `helm-charts/` as strictly out of scope for autodoc findings.
        - **Repository autodoc ignore file** — When `.oblt-aw.autodocignore` exists at the repository root, treat its patterns with `.gitignore` (gitwildmatch) semantics. Never propose documentation findings that require editing ignored paths. Active patterns from that file are appended to these instructions at runtime when present.

        **Issue format:** For each finding, include a clear, actionable checklist of specific documentation changes to make. Each item should reference file paths and describe the change needed.

        **Team notification (mandatory):** Always @mention @elastic/observablt-ci at the top of the issue body so the team receives notifications. Example: "cc @elastic/observablt-ci" or "Notify: @elastic/observablt-ci" at the start of the body.

  audit:
    needs: [resolve-apm-assets-audit]
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      copilot-requests: write
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-docs-patrol.lock.yml@main
    with:
      lookback-window: 1 day ago
      title-prefix: "[oblt-aw][autodoc]"
      additional-instructions: ${{ needs.resolve-apm-assets-audit.outputs.resolved-additional-instructions }}
    secrets: inherit

  resolve-apm-assets-fix:
    needs: audit
    if: needs.audit.outputs.created_issue_number != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-autodoc.yml
      platform-additional-instructions: |
        Your task is to implement the documentation improvements described in the issue.

        **Pull Request Requirements:**
        - Title: `docs: Documentation analysis and improvement`
        - Body must include:
          - `Closes #<issue-number>` at the top to link and auto-close the audit issue on merge
          - Summary of files analyzed
          - List of issues found (with file paths and concise descriptions)
          - List of changes made (with rationale for each change)
        - Convert from `Draft` to `Open` (ready for review) only when all changes are implemented and internally consistent.

        **Constraints:**
        - Do not modify source code, workflow logic, scripts, or data files — only documentation files.
        - Do not create new workflow YAML files.
        - Prefer targeted, high-confidence improvements over speculative rewrites.
        - All changes must be grounded in actual repository content — do not invent capability descriptions.
        - Do not add placeholder text or TODOs as improvements.

        **Secret documentation:** When implementing documentation related to secret definitions or usage, follow the Observability org rules encoded here. Do **not** attempt to read private repositories (including [`elastic/observability-github-secrets`](https://github.com/elastic/observability-github-secrets)) via GitHub tools or MCP. Do not add guidance that contradicts these rules or invent process beyond them and what is already documented in the target repository:
        - Prefer ephemeral GitHub tokens (`elastic/oblt-actions/github/create-token`) and catalog TokenPolicy over long-lived repository secrets when that pattern applies.
        - Do not recommend provisioning secrets only via GitHub **Settings → Secrets** unless the repository's own docs already document that exception.
        - When long-lived Action secrets are required, tell readers to provision them through [`elastic/observability-github-secrets`](https://github.com/elastic/observability-github-secrets) per org process; do not invent alternate provisioning procedures.
        - Use exact secret names from the repository's workflow documentation when present; do not invent secret names or procedures.

        **Markdown tables:** Preserve deliberate cell content such as a leading `-` used as an icon or status placeholder; do not rewrite table rows into bullet lists or "clean up" punctuation unless it is clearly a mistake.

        **Markdown link fragments / anchors:** When editing markdown links with `#fragment`, first validate the fragment against the target document heading slug(s). Preserve the existing fragment unless verification proves it is incorrect. Do not remove a leading `-` when it is part of the valid computed slug (for example icon-prefixed headings): the `-` character is a valid replacement for a leading icon in heading text and therefore a valid part of the anchor slug. Rewriting `[Lab 01: Troubleshooting](01-installation-setup.md#-troubleshooting-quick-reference)` to `[Lab 01: Troubleshooting](01-installation-setup.md#troubleshooting-quick-reference)` is invalid when the verified heading slug is `#-troubleshooting-quick-reference`.

        **Auto-generated docs:** Skip hand-editing any file that is obviously generated or regenerated by tooling. If the issue asks for edits there, leave those files unchanged (this job is docs-only) and note in the PR body what generator, template, automation, or out-of-repo follow-up would be needed; apply any safe changes only to human-maintained documentation files permitted above.

        **Legacy / historical comments:** When updating prose near inline comments that document past context or rationale, keep those comments when they remain true or still help readers understand edge cases; prefer minimal edits or a brief clarification over deleting long-standing context solely for brevity.

        **AI assets / agent configuration files:** Never modify AI-related assets in this workflow. AI assets, skills files, instruction/configuration files, and lock files (for example `*.lock*` and `*.lock.yml`) are always out of scope.

        **Helm chart internals:** Never modify Helm chart internal files. Template files (`helm-charts/**/templates/**`), notes files (`helm-charts/**/NOTES.txt`), and markdown files under `helm-charts/` are always out of scope.

        **Repository autodoc ignore file:** When `.oblt-aw.autodocignore` exists at the repository root, treat its patterns with `.gitignore` (gitwildmatch) semantics. Never modify paths that match those patterns, even when an issue requests it; note any skipped items in the PR body. Active patterns from that file are appended to these instructions at runtime when present.

  # Step 2: Create a PR implementing the audit findings (only when an issue was created)
  fix:
    needs: [audit, resolve-apm-assets-fix]
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      copilot-requests: write
    if: needs.audit.outputs.created_issue_number != ''
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-create-pr-from-issue.lock.yml@main
    with:
      target-issue-number: ${{ needs.audit.outputs.created_issue_number }}
      draft-prs: true
      additional-instructions: ${{ needs.resolve-apm-assets-fix.outputs.resolved-additional-instructions }}
    secrets: inherit

  # Step 3: Finalize autodoc PR — assign reviewer and apply labels
  finalize-pr:
    needs: fix
    if: needs.fix.outputs.created_pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request review from elastic/observablt-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.fix.outputs.created_pr_number }}
        run: gh pr edit "$PR_NUMBER" --add-reviewer "elastic/observablt-ci" --repo "$GITHUB_REPOSITORY"
      - name: Apply changelog:docs label if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.fix.outputs.created_pr_number }}
        run: |
          if gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' | grep -qx "changelog:docs"; then
            gh pr edit "$PR_NUMBER" --add-label "changelog:docs" --repo "$GITHUB_REPOSITORY"
          fi

  # When the PR stage fails after an audit issue was created (for example Copilot
  # CAPI 502 proxy errors), leave recoverable guidance on the issue.
  notify-fix-failure:
    needs: [audit, fix]
    if: >-
      always() &&
      needs.audit.result == 'success' &&
      needs.audit.outputs.created_issue_number != '' &&
      needs.fix.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment recovery guidance on the audit issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.audit.outputs.created_issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo 'Autodoc created this issue, but the follow-up PR stage failed.'
            echo
            echo "- Workflow run: ${RUN_URL}"
            echo '- Common cause: transient Copilot API errors such as `CAPIError: 502 "Proxy error"`'
            echo
            echo '**Recovery:** as an OWNER, MEMBER, or COLLABORATOR, comment `/ai implement` on this issue to retry PR creation via issue-fixer. You can also wait for the next successful autodoc schedule after the API recovers.'
          } | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
      - name: Apply autodoc fix-failed label if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.audit.outputs.created_issue_number }}
        run: |
          set -euo pipefail
          if gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' | grep -qx "oblt-aw/autodoc/fix-failed"; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "oblt-aw/autodoc/fix-failed"
          fi
