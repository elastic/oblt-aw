name: Automated Documentation Analysis and Improvement
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-prelude.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
      e2e-autodoc-mode:
        description: >-
          When true, audit-only platform text forces docs-patrol to evaluate
          only docs/testing/fixtures/e2e-autodoc-bait.md (false for normal runs).
        required: false
        type: boolean
        default: false
permissions:
  contents: read

jobs:

  # Step 1: Detect docs drift from recent code changes and create an issue with findings
  # Audit prompt lives in gh-aw-docs-patrol.md; resolve still merges APM + autodocignore.
  # E2E mode injects fixed audit-only platform text (not free-form); fix resolve never
  # receives it (create-PR must not be told to "file an issue").
  resolve-apm-assets-audit:
    if: inputs.shared-proceed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-autodoc.yml
      platform-additional-instructions: ${{ inputs.e2e-autodoc-mode && 'E2E_AUTODOC_MODE=true. Evaluate ONLY `docs/testing/fixtures/e2e-autodoc-bait.md`. That file is an intentional incomplete documentation page that must be updated. Ignore all other documentation gaps and commit drift. Do not noop because the lookback window has no commits. File exactly one issue that cites that path and includes `E2E_AUTODOC_BAIT_MARKER` in the issue body.' || '' }}

  audit:
    if: inputs.shared-proceed == 'true'
    needs: [resolve-apm-assets-audit]
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      copilot-requests: write
    # Relative so client @v0 / control-plane tip pins inherit the release train.
    uses: ./.github/workflows/gh-aw-docs-patrol.lock.yml
    with:
      # Lookback (1 day), title-prefix ([oblt-aw][autodoc]), model/bots/footer,
      # and failure-issue suppression are opinionated on the in-repo lock.
      additional-instructions: ${{ needs.resolve-apm-assets-audit.outputs.resolved-additional-instructions }}
    secrets:
      GH_AW_DEFAULT_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
      GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
      GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}

  # Fix prompt lives in gh-aw-create-pr-from-issue.md; resolve still merges APM + autodocignore.
  resolve-apm-assets-fix:
    needs: audit
    if: inputs.shared-proceed == 'true' && needs.audit.outputs.created_issue_number != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-autodoc.yml

  # Step 2: Create a PR implementing the audit findings (only when an issue was created)
  fix:
    needs: [audit, resolve-apm-assets-fix]
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      copilot-requests: write
    if: inputs.shared-proceed == 'true' && needs.audit.outputs.created_issue_number != ''
    # Relative so client @v0 / control-plane tip pins inherit the release train.
    uses: ./.github/workflows/gh-aw-create-pr-from-issue.lock.yml
    with:
      # Draft PRs, model/bots/footer, failure-issue suppression, and docs-only
      # prompt (including top-level docs protected-files excludes) are
      # opinionated on the in-repo lock.
      target-issue-number: ${{ needs.audit.outputs.created_issue_number }}
      additional-instructions: ${{ needs.resolve-apm-assets-fix.outputs.resolved-additional-instructions }}
    secrets:
      EXTRA_COMMIT_GITHUB_TOKEN: ${{ secrets.EXTRA_COMMIT_GITHUB_TOKEN }}
      GH_AW_DEFAULT_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
      GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
      GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}

  # Step 3: Finalize autodoc PR — link audit issue for close-on-merge, assign reviewer, labels
  finalize-pr:
    needs: [audit, fix]
    if: inputs.shared-proceed == 'true' && needs.fix.outputs.created_pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # create-pull-request safe-output neutralizes agent Closes/Fixes keywords, and
      # workflow_call has no issue-event trigger for auto-close-issue. Inject a real
      # Fixes line here so GitHub closes the audit issue when the PR merges.
      - name: Ensure Fixes keyword closes audit issue on merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.fix.outputs.created_pr_number }}
          ISSUE_NUMBER: ${{ needs.audit.outputs.created_issue_number }}
        run: |
          set -euo pipefail
          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "No audit issue number; skipping Fixes keyword"
            exit 0
          fi
          body="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          if printf '%s\n' "$body" | grep -qiE "(fix|fixes|fixed|close|closes|closed|resolve|resolves|resolved)[[:space:]]+#${ISSUE_NUMBER}\\b"; then
            echo "Closing keyword for #${ISSUE_NUMBER} already present"
            exit 0
          fi
          {
            printf 'Fixes #%s\n\n' "$ISSUE_NUMBER"
            printf '%s\n' "$body"
          } > "${RUNNER_TEMP}/autodoc-pr-body.md"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/autodoc-pr-body.md"
      - name: Request review from elastic/observablt-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.fix.outputs.created_pr_number }}
        run: gh pr edit "$PR_NUMBER" --add-reviewer "elastic/observablt-ci" --repo "$GITHUB_REPOSITORY"
      - name: Apply changelog:docs label if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.fix.outputs.created_pr_number }}
        run: |
          if gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' | grep -qx "changelog:docs"; then
            gh pr edit "$PR_NUMBER" --add-label "changelog:docs" --repo "$GITHUB_REPOSITORY"
          fi

  # When the PR stage fails after an audit issue was created (for example Copilot
  # CAPI 502 proxy errors), leave recoverable guidance on the issue.
  notify-fix-failure:
    needs: [audit, fix]
    if: >-
      always() &&
      needs.audit.result == 'success' &&
      needs.audit.outputs.created_issue_number != '' &&
      needs.fix.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment recovery guidance on the audit issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.audit.outputs.created_issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Autodoc created this issue, but could not open a follow-up pull request."
            echo
            echo "Comment \`/ai implement\` on this issue to retry (you need write access), or wait for the next autodoc run."
            echo
            echo "Workflow run: ${RUN_URL}"
          } | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
      - name: Apply autodoc fix-failed label if it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.audit.outputs.created_issue_number }}
        run: |
          set -euo pipefail
          if gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' | grep -qx "oblt-aw/autodoc/fix-failed"; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "oblt-aw/autodoc/fix-failed"
          fi

  # Lock can succeed with empty created_pr_number (no create_pull_request safe
  # output). Mirror issue/security/RNAI fixers: leave recovery on the audit issue.
  notify-no-pr:
    needs: [audit, fix]
    if: >-
      always() &&
      needs.audit.result == 'success' &&
      needs.audit.outputs.created_issue_number != '' &&
      needs.fix.result == 'success' &&
      needs.fix.outputs.created_pr_number == ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on audit issue when fix opened no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.audit.outputs.created_issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "Autodoc finished without opening a pull request."
            echo
            echo "If you expected a PR, comment \`/ai implement\` on this issue to retry (you need write access)."
            echo
            echo "Workflow run: ${RUN_URL}"
          } | gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file -
