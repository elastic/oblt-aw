---
name: Issue Triage
on:
  workflow_call:
    inputs:
      allowed-bot-users:
        description: Comma-separated GitHub logins (from load-allowed-authors allowed_issue_authors_csv)
        required: false
        type: string
        default: github-actions[bot]
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  actions: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write

jobs:
  issue-triage:
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-issue-triage.lock.yml@main
    with:
      allowed-bot-users: ${{ inputs.allowed-bot-users }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
