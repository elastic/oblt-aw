name: Agentic Workflow Prelude

# Shared dashboard gating, optional allow-list loading, and APM asset resolution for *-aw-* workflows.
# Call this reusable workflow before agent-specific jobs in oblt-aw-* and docs-aw-* wrappers.
on:
  workflow_call:
    inputs:
      enabled-workflow-id:
        description: Compound Control Plane id (for example obs:automerge)
        required: true
        type: string
      load-allowed-authors:
        description: Load PR and issue allow lists from elastic/oblt-aw config
        required: false
        type: boolean
        default: false
      platform-additional-instructions:
        description: >-
          Control-plane baseline additional-instructions for the agentic workflow.
          Merged with consumer apm.yml assets (platform first, then repo assets).
        required: false
        type: string
        default: ""
      platform-inputs-json:
        description: >-
          JSON object of platform workflow_call inputs to merge; repo apm.yml inputs
          override per key when an asset block is selected.
        required: false
        type: string
        default: "{}"
      install-apm-packages:
        description: Run `apm install` when apm.yml is present in the consumer repository
        required: false
        type: boolean
        default: true
    outputs:
      proceed:
        description: >-
          True when dashboard gating allows this workflow (effective-raw empty or
          enabled-workflow-id is listed in enabled-workflows).
        value: ${{ jobs.evaluate.outputs.proceed }}
      effective-raw:
        description: Raw dashboard read before normalization ('' means all enabled)
        value: ${{ jobs.dashboard.outputs.effective-raw }}
      enabled-workflows:
        description: Normalized JSON array of compound ids from the dashboard
        value: ${{ jobs.dashboard.outputs.enabled-workflows }}
      allowed-pr-authors-json:
        description: JSON array of allowed PR bot logins (empty when not loaded)
        value: ${{ jobs.evaluate.outputs.allowed-pr-authors-json }}
      allowed-pr-authors-csv:
        description: Comma-separated allowed PR bot logins (empty when not loaded)
        value: ${{ jobs.evaluate.outputs.allowed-pr-authors-csv }}
      allowed-issue-authors-json:
        description: JSON array of allowed issue bot logins (empty when not loaded)
        value: ${{ jobs.evaluate.outputs.allowed-issue-authors-json }}
      allowed-issue-authors-csv:
        description: Comma-separated allowed issue bot logins (empty when not loaded)
        value: ${{ jobs.evaluate.outputs.allowed-issue-authors-csv }}
      apm-manifest-present:
        description: True when the consumer repository contains apm.yml or apm.yaml
        value: ${{ jobs.apm-assets.outputs.apm-manifest-present }}
      apm-extension-present:
        description: True when apm.yml contains an x-oblt-aw extension block
        value: ${{ jobs.apm-assets.outputs.apm-extension-present }}
      asset-source:
        description: none, common, or workflow (APM asset block used for resolution)
        value: ${{ jobs.apm-assets.outputs.asset-source }}
      resolved-additional-instructions:
        description: Platform baseline plus resolved repo additional-instructions
        value: ${{ jobs.apm-assets.outputs.resolved-additional-instructions }}
      resolved-inputs-json:
        description: JSON object of merged platform and APM workflow inputs
        value: ${{ jobs.apm-assets.outputs.resolved-inputs-json }}
      resolved-setup-commands-json:
        description: JSON array of setup shell commands from APM assets
        value: ${{ jobs.apm-assets.outputs.resolved-setup-commands-json }}

permissions:
  contents: read

jobs:
  dashboard:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/get-enabled-workflows.yml

  allowed-authors:
    permissions:
      contents: read
    if: >-
      inputs.load-allowed-authors &&
      (github.event_name == 'pull_request' || github.event_name == 'issues')
    uses: ./.github/workflows/load-allowed-authors.yml

  evaluate:
    needs: [dashboard, allowed-authors]
    permissions:
      contents: read
    if: >-
      always() &&
      needs.dashboard.result == 'success' &&
      (needs.allowed-authors.result == 'success' || needs.allowed-authors.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      allowed-pr-authors-json: ${{ steps.pack.outputs.allowed-pr-authors-json }}
      allowed-pr-authors-csv: ${{ steps.pack.outputs.allowed-pr-authors-csv }}
      allowed-issue-authors-json: ${{ steps.pack.outputs.allowed-issue-authors-json }}
      allowed-issue-authors-csv: ${{ steps.pack.outputs.allowed-issue-authors-csv }}
    steps:
      - name: Evaluate dashboard gate
        id: gate
        env:
          EFFECTIVE_RAW: ${{ needs.dashboard.outputs.effective-raw }}
          ENABLED_WORKFLOWS: ${{ needs.dashboard.outputs.enabled-workflows }}
          ENABLED_WORKFLOW_ID: ${{ inputs.enabled-workflow-id }}
        run: |
          set -euo pipefail
          if [ -z "${EFFECTIVE_RAW}" ]; then
            echo "proceed=true"
          elif echo "${ENABLED_WORKFLOWS}" | jq -e --arg id "${ENABLED_WORKFLOW_ID}" 'index($id) != null' >/dev/null; then
            echo "proceed=true"
          else
            echo "proceed=false"
          fi >> "${GITHUB_OUTPUT}"

      - name: Pack allow-list outputs
        id: pack
        env:
          PR_JSON: ${{ needs.allowed-authors.outputs.allowed_pr_authors_json }}
          PR_CSV: ${{ needs.allowed-authors.outputs.allowed_pr_authors_csv }}
          ISSUE_JSON: ${{ needs.allowed-authors.outputs.allowed_issue_authors_json }}
          ISSUE_CSV: ${{ needs.allowed-authors.outputs.allowed_issue_authors_csv }}
        run: |
          set -euo pipefail
          {
            echo "allowed-pr-authors-json=${PR_JSON:-[]}"
            echo "allowed-pr-authors-csv=${PR_CSV:-}"
            echo "allowed-issue-authors-json=${ISSUE_JSON:-[]}"
            echo "allowed-issue-authors-csv=${ISSUE_CSV:-}"
          } >> "${GITHUB_OUTPUT}"

  apm-assets:
    needs: [dashboard, allowed-authors, evaluate]
    permissions:
      contents: read
    if: >-
      always() &&
      needs.dashboard.result == 'success' &&
      (needs.allowed-authors.result == 'success' || needs.allowed-authors.result == 'skipped') &&
      needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apm-manifest-present: ${{ steps.resolve.outputs.apm-manifest-present }}
      apm-extension-present: ${{ steps.resolve.outputs.apm-extension-present }}
      asset-source: ${{ steps.resolve.outputs.asset-source }}
      resolved-additional-instructions: ${{ steps.resolve.outputs.resolved-additional-instructions }}
      resolved-inputs-json: ${{ steps.resolve.outputs.resolved-inputs-json }}
      resolved-setup-commands-json: ${{ steps.resolve.outputs.resolved-setup-commands-json }}
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v6

      - name: Checkout oblt-aw resolver scripts
        uses: actions/checkout@v6
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          sparse-checkout: |
            scripts/apm_agentic_assets.py
            scripts/resolve_apm_agentic_assets.py
            scripts/common.py
          sparse-checkout-cone-mode: false

      - name: Detect apm manifest
        id: detect
        run: |
          set -euo pipefail
          if [ -f apm.yml ] || [ -f apm.yaml ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies for resolver
        run: pip install PyYAML==6.0.2

      - name: Install APM CLI
        if: >-
          inputs.install-apm-packages &&
          steps.detect.outputs.present == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://aka.ms/apm-unix | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install agent packages from apm.yml
        if: >-
          inputs.install-apm-packages &&
          steps.detect.outputs.present == 'true'
        run: |
          set -euo pipefail
          apm install

      - name: Resolve agentic assets from apm.yml
        id: resolve
        env:
          ENABLED_WORKFLOW_ID: ${{ inputs.enabled-workflow-id }}
          REPO_ROOT: ${{ github.workspace }}
          PLATFORM_ADDITIONAL_INSTRUCTIONS: ${{ inputs.platform-additional-instructions }}
          PLATFORM_INPUTS_JSON: ${{ inputs.platform-inputs-json }}
        run: python _oblt-aw/scripts/resolve_apm_agentic_assets.py
