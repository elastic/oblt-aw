name: Agentic Workflow Prelude

# Shared dashboard read and optional allow-list loading for ingress workflows.
# APM asset resolution lives in aw-resolve-apm-assets.yml (per gh-aw-* invocation).
on:
  workflow_call:
    inputs:
      load-allowed-authors:
        description: Load PR and issue allow lists from elastic/oblt-aw config
        required: false
        type: boolean
        default: false
      ingress-event-name:
        description: Relayed event name from ingress (empty uses github.event_name)
        required: false
        type: string
        default: ''
    outputs:
      proceed:
        description: Always true; route jobs gate on enabled-workflows in ingress
        value: ${{ jobs.evaluate.outputs.proceed }}
      effective-raw:
        description: Raw dashboard read before normalization ('' means all enabled)
        value: ${{ jobs.dashboard.outputs.effective-raw }}
      enabled-workflows:
        description: Normalized JSON array of compound ids from the dashboard
        value: ${{ jobs.dashboard.outputs.enabled-workflows }}
      allowed-pr-authors-json:
        description: JSON array of allowed PR bot logins (empty when not loaded)
        value: ${{ jobs.evaluate.outputs.allowed-pr-authors-json }}
      allowed-pr-authors-csv:
        description: Comma-separated allowed PR bot logins (empty when not loaded)
        value: ${{ jobs.evaluate.outputs.allowed-pr-authors-csv }}
      allowed-issue-authors-json:
        description: JSON array of allowed issue bot logins (empty when not loaded)
        value: ${{ jobs.evaluate.outputs.allowed-issue-authors-json }}
      allowed-issue-authors-csv:
        description: Comma-separated allowed issue bot logins (empty when not loaded)
        value: ${{ jobs.evaluate.outputs.allowed-issue-authors-csv }}
      token-policy:
        description: >-
          Token policy from config/<org>/active-repositories.json for this repository;
          passed as ingress-token-policy to workflows that call create-token.
        value: ${{ jobs.evaluate.outputs.token-policy }}

permissions:
  contents: read

jobs:
  dashboard:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/get-enabled-workflows.yml

  allowed-authors:
    permissions:
      contents: read
    if: >-
      inputs.load-allowed-authors &&
      (
        (inputs.ingress-event-name != '' && inputs.ingress-event-name || github.event_name) == 'pull_request' ||
        (inputs.ingress-event-name != '' && inputs.ingress-event-name || github.event_name) == 'issues'
      )
    uses: ./.github/workflows/load-allowed-authors.yml

  evaluate:
    needs: [dashboard, allowed-authors]
    permissions:
      contents: read
    if: >-
      always() &&
      needs.dashboard.result == 'success' &&
      (needs.allowed-authors.result == 'success' || needs.allowed-authors.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      allowed-pr-authors-json: ${{ steps.pack.outputs.allowed-pr-authors-json }}
      allowed-pr-authors-csv: ${{ steps.pack.outputs.allowed-pr-authors-csv }}
      allowed-issue-authors-json: ${{ steps.pack.outputs.allowed-issue-authors-json }}
      allowed-issue-authors-csv: ${{ steps.pack.outputs.allowed-issue-authors-csv }}
      token-policy: ${{ steps.token-policy.outputs.token-policy }}
    steps:
      - name: Checkout oblt-aw (registry scripts + config)
        uses: actions/checkout@v6
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            scripts/workflow_registry.py
            scripts/common.py
            scripts/resolve_repository_token_policy.py
            config/
          sparse-checkout-cone-mode: false

      - name: Resolve repository token policy
        id: token-policy
        env:
          CONFIG_DIR: _oblt-aw/config
          TARGET_REPOSITORY: ${{ github.repository }}
        run: python _oblt-aw/scripts/resolve_repository_token_policy.py

      - name: Set proceed output
        id: gate
        run: echo "proceed=true" >> "${GITHUB_OUTPUT}"

      - name: Pack allow-list outputs
        id: pack
        env:
          PR_JSON: ${{ needs.allowed-authors.outputs.allowed_pr_authors_json }}
          PR_CSV: ${{ needs.allowed-authors.outputs.allowed_pr_authors_csv }}
          ISSUE_JSON: ${{ needs.allowed-authors.outputs.allowed_issue_authors_json }}
          ISSUE_CSV: ${{ needs.allowed-authors.outputs.allowed_issue_authors_csv }}
        run: |
          set -euo pipefail
          {
            echo "allowed-pr-authors-json=${PR_JSON:-[]}"
            echo "allowed-pr-authors-csv=${PR_CSV:-}"
            echo "allowed-issue-authors-json=${ISSUE_JSON:-[]}"
            echo "allowed-issue-authors-csv=${ISSUE_CSV:-}"
          } >> "${GITHUB_OUTPUT}"
