name: Resolve Agentic Assets

# Resolves consumer agentic assets for one workflow invocation (apm.yml, autodocignore,
# and other consumer-side configuration). Call immediately before each job that uses a
# gh-aw-* reusable workflow (not from aw-prelude).
on:
  workflow_call:
    inputs:
      control-plane-workflow:
        description: >-
          Basename of the calling wrapper under .github/workflows/ (for example
          obs-aw-automerge.yml). Used to resolve the registry workflow id for apm.yml.
        required: true
        type: string
      platform-additional-instructions:
        description: >-
          Control-plane baseline additional-instructions for this agent invocation.
          Merged with consumer apm.yml assets (platform first, then repo assets).
        required: false
        type: string
        default: ""
      platform-inputs-json:
        description: >-
          JSON object of platform workflow_call inputs to merge; repo apm.yml inputs
          override per key when an asset block is selected.
        required: false
        type: string
        default: "{}"
      install-apm-packages:
        description: Run `apm install` when apm.yml is present in the consumer repository
        required: false
        type: boolean
        default: true
    outputs:
      apm-manifest-present:
        description: True when the consumer repository contains apm.yml or apm.yaml
        value: ${{ jobs.resolve-agentic-assets.outputs.apm-manifest-present }}
      apm-extension-present:
        description: True when apm.yml contains an x-oblt-aw extension block
        value: ${{ jobs.resolve-agentic-assets.outputs.apm-extension-present }}
      asset-source:
        description: none, common, workflow, or inner-workflow (APM asset block used for resolution)
        value: ${{ jobs.resolve-agentic-assets.outputs.asset-source }}
      resolved-additional-instructions:
        description: >-
          Control-plane fragments, platform inline text, and resolved repo
          additional-instructions (APM plus consumer-side auto layers)
        value: ${{ jobs.resolve-agentic-assets.outputs.resolved-additional-instructions }}
      resolved-inputs-json:
        description: JSON object of merged platform and APM workflow inputs
        value: ${{ jobs.resolve-agentic-assets.outputs.resolved-inputs-json }}
      resolved-setup-commands-json:
        description: JSON array of setup shell commands from APM assets
        value: ${{ jobs.resolve-agentic-assets.outputs.resolved-setup-commands-json }}
      resolved-instruction-layers-json:
        description: >-
          JSON object describing which instruction fragments and inline/auto
          layers were appended for this run
        value: ${{ jobs.resolve-agentic-assets.outputs.resolved-instruction-layers-json }}

permissions:
  contents: read

jobs:
  resolve-agentic-assets:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apm-manifest-present: ${{ steps.resolve.outputs.apm-manifest-present }}
      apm-extension-present: ${{ steps.resolve.outputs.apm-extension-present }}
      asset-source: ${{ steps.resolve.outputs.asset-source }}
      resolved-additional-instructions: ${{ steps.resolve.outputs.resolved-additional-instructions }}
      resolved-inputs-json: ${{ steps.resolve.outputs.resolved-inputs-json }}
      resolved-setup-commands-json: ${{ steps.resolve.outputs.resolved-setup-commands-json }}
      resolved-instruction-layers-json: ${{ steps.resolve.outputs.resolved-instruction-layers-json }}
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v7

      - name: Checkout oblt-aw resolver scripts
        uses: actions/checkout@v7
        with:
          repository: elastic/oblt-aw
          ref: main
          path: _oblt-aw
          fetch-depth: 1
          token: ${{ github.token }}
          sparse-checkout: |
            scripts/agentic_assets_resolver.py
            scripts/apm_agentic_assets.py
            scripts/autodocignore.py
            scripts/instruction_fragments.py
            scripts/resolve_agentic_assets_cli.py
            scripts/resolve_control_plane_workflow_id.py
            scripts/resolve_repository_token_policy.py
            scripts/workflow_registry.py
            scripts/common.py
            config/
            requirements-runtime.txt
          sparse-checkout-cone-mode: false

      - name: Resolve compound workflow id from registry
        id: registry
        env:
          CONTROL_PLANE_WORKFLOW: ${{ inputs.control-plane-workflow }}
        run: python _oblt-aw/scripts/resolve_control_plane_workflow_id.py "${CONTROL_PLANE_WORKFLOW}" --config-dir _oblt-aw/config

      - name: Detect apm manifest
        id: detect
        run: |
          set -euo pipefail
          if [ -f apm.yml ] || [ -f apm.yaml ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve AI assets token policy
        id: ai-assets-token-policy
        if: >-
          inputs.install-apm-packages &&
          steps.detect.outputs.present == 'true'
        env:
          CONFIG_DIR: _oblt-aw/config
          TARGET_REPOSITORY: ${{ github.repository }}
        run: >-
          python _oblt-aw/scripts/resolve_repository_token_policy.py
          --policy-field ai-assets-token-policy

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: _oblt-aw/requirements-runtime.txt

      - name: Install Python dependencies for resolver
        run: pip install -r _oblt-aw/requirements-runtime.txt

      - name: Create ephemeral GitHub token for APM private dependencies
        id: create-apm-token
        if: >-
          inputs.install-apm-packages &&
          steps.detect.outputs.present == 'true' &&
          steps.ai-assets-token-policy.outputs.ai-assets-token-policy != ''
        uses: elastic/oblt-actions/github/create-token@v1
        with:
          token-policy: ${{ steps.ai-assets-token-policy.outputs.ai-assets-token-policy }}

      - name: Install agent packages from apm.yml
        if: >-
          inputs.install-apm-packages &&
          steps.detect.outputs.present == 'true'
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          apm-version: "0.20.0"
          github-token: ${{ steps.create-apm-token.outputs.token || github.token }}

      - name: Resolve agentic assets
        id: resolve
        env:
          ENABLED_WORKFLOW_ID: ${{ steps.registry.outputs.compound-workflow-id }}
          REPO_ROOT: ${{ github.workspace }}
          CONTROL_PLANE_CONFIG_DIR: ${{ github.workspace }}/_oblt-aw/config
          CONTROL_PLANE_WORKFLOW: ${{ inputs.control-plane-workflow }}
          PLATFORM_ADDITIONAL_INSTRUCTIONS: ${{ inputs.platform-additional-instructions }}
          PLATFORM_INPUTS_JSON: ${{ inputs.platform-inputs-json }}
        run: python _oblt-aw/scripts/resolve_agentic_assets_cli.py
