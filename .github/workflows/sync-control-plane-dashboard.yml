name: Sync Control Plane Dashboard

# Deprecated monolith entrypoint. Org-scoped workflows own OIDC TokenPolicies:
#   sync-control-plane-dashboard-obs.yml
#   sync-control-plane-dashboard-security.yml
# This workflow only fans out workflow_dispatch / push to those entrypoints via
# GitHub's workflow_call into shared job logic is intentionally not used here for minting.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-control-plane-dashboard.yml
  workflow_dispatch:
    inputs:
      force-sync-defaults:
        description: >-
          Unused on the legacy entrypoint; run sync-control-plane-dashboard-obs or
          sync-control-plane-dashboard-security instead.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-control-plane-dashboard-legacy
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point operators at org-scoped sync workflows
        run: |
          {
            echo "## Deprecated entrypoint"
            echo
            echo "Use these workflows instead (unique workflow_ref per Backstage org):"
            echo
            echo "- \`sync-control-plane-dashboard-obs.yml\`"
            echo "- \`sync-control-plane-dashboard-security.yml\`"
            echo
            echo "This legacy workflow no longer mints tokens or syncs dashboards."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Legacy sync-control-plane-dashboard.yml is a no-op; use org-scoped sync workflows."
