name: Observability Agentic Workflow — Issues Event

# Event-scoped orchestrator: one shared prelude chain for all issues/workflow_dispatch routes.
on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  prelude:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/aw-prelude.yml
    with:
      control-plane-workflows: >-
        ["oblt-aw-issue-triage.yml","oblt-aw-duplicate-issue-detector.yml","oblt-aw-security-triage.yml","oblt-aw-security-fixer.yml","oblt-aw-resource-not-accessible-by-integration-triage.yml","oblt-aw-resource-not-accessible-by-integration-fixer.yml"]
      load-allowed-authors: true

  issue-triage:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-issue-triage.yml'] == 'true' &&
      github.event_name == 'issues' &&
      github.event.action == 'opened'
    permissions:
      actions: read
      contents: read
      discussions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-issue-triage.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-issue-triage.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  duplicate-issue-detector:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-duplicate-issue-detector.yml'] == 'true' &&
      (
        (github.event_name == 'issues' && github.event.action == 'opened') ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/oblt-aw-duplicate-issue-detector.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-duplicate-issue-detector.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  security-triage:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-security-triage.yml'] == 'true' &&
      github.event_name == 'issues' &&
      (
        (github.event.action == 'opened' && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/detector/security')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'oblt-aw/detector/security')
      )
    permissions:
      actions: read
      contents: read
      discussions: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-security-triage.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-security-triage.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  security-fixer:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-security-fixer.yml'] == 'true' &&
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      (
        (github.event.label.name == 'oblt-aw/ai/fix-ready' && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/triage/security-')) ||
        (startsWith(github.event.label.name, 'oblt-aw/triage/security-') && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/ai/fix-ready'))
      )
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-security-fixer.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-security-fixer.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  resource-not-accessible-triage:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-resource-not-accessible-by-integration-triage.yml'] == 'true' &&
      github.event_name == 'issues' &&
      (
        (github.event.action == 'opened' && contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/detector/res-not-accessible-by-integration')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'oblt-aw/detector/res-not-accessible-by-integration')
      )
    permissions:
      actions: read
      contents: read
      discussions: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-resource-not-accessible-by-integration-triage.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-resource-not-accessible-by-integration-triage.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  resource-not-accessible-fixer:
    needs: prelude
    if: >-
      fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-resource-not-accessible-by-integration-fixer.yml'] == 'true' &&
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'oblt-aw/ai/fix-ready' &&
      contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/triage/res-not-accessible-by-integration')
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-resource-not-accessible-by-integration-fixer.yml
    with:
      shared-proceed: ${{ fromJSON(needs.prelude.outputs.proceed-by-workflow)['oblt-aw-resource-not-accessible-by-integration-fixer.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.prelude.outputs.token-policy }}
    secrets: inherit
