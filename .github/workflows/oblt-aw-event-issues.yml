name: Observability Agentic Workflow — Issues Event

# Event-scoped orchestrator: one shared prelude chain for all issues/workflow_dispatch routes.
on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  event-context:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/aw-event-context.yml
    with:
      control-plane-workflows: >-
        ["oblt-aw-issue-triage.yml","oblt-aw-duplicate-issue-detector.yml","oblt-aw-security-triage.yml","oblt-aw-security-fixer.yml","oblt-aw-resource-not-accessible-by-integration-triage.yml","oblt-aw-resource-not-accessible-by-integration-fixer.yml"]
      load-allowed-authors: true

  issue-triage:
    needs: event-context
    permissions:
      actions: read
      contents: read
      discussions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-issue-triage.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-issue-triage.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  duplicate-issue-detector:
    needs: event-context
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/oblt-aw-duplicate-issue-detector.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-duplicate-issue-detector.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  security-triage:
    needs: event-context
    permissions:
      actions: read
      contents: read
      discussions: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-security-triage.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-security-triage.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  security-fixer:
    needs: event-context
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-security-fixer.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-security-fixer.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  resource-not-accessible-triage:
    needs: event-context
    permissions:
      actions: read
      contents: read
      discussions: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-resource-not-accessible-by-integration-triage.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-resource-not-accessible-by-integration-triage.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  resource-not-accessible-fixer:
    needs: event-context
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-resource-not-accessible-by-integration-fixer.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-resource-not-accessible-by-integration-fixer.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets: inherit
