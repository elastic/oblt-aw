---
name: E2E — Secret leak artifacts

# Dedicated live E2E for the H1 / golang-crossbuild failure mode (#2428):
# OTLP headers must not appear in cleartext inside uploaded agent sandbox /
# firewall audit artifacts after GH-AW mask_otlp_headers + redact_secrets.
# Setup scripts come from github/gh-aw-actions/setup resolved from
# `.aw-compiler-version` (so compiler upgrades are exercised here).
# Uses a fake canary (not a live observability-ci intake key).
# Not part of the default PR required gate in ci.yml.
on:
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: Git ref or full SHA to checkout (default main tip)
        required: false
        type: string
        default: main
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or full SHA to checkout (default main tip)
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: e2e-secret-leak-artifacts
  cancel-in-progress: false

env:
  CASE_ID: otel-headers-absent-from-agent-artifact-live
  E2E_ARTIFACT_NAME: e2e-secret-leak-agent
  E2E_AUDIT_MARKER: OBLT_AW_E2E_SECRET_LEAK_AUDIT_PLANTED
  # Fake canaries only — not real Elasticsearch / observability-ci keys.
  # Shapes mirror gh-aw#68811 extraction (ApiKey, Basic decoded password,
  # multi-endpoint ALL_HEADERS, percent-encoded headers).
  E2E_OTLP_CANARY_ENDPOINT: https://e2e-otlp-canary.invalid.example.oblt-aw:443
  E2E_OTLP_CANARY_HEADERS: >-
    Authorization=ApiKey OBLT_AW_E2E_OTLP_CANARY_ID_DO_NOT_USE:OBLT_AW_E2E_OTLP_CANARY_SECRET_DO_NOT_USE_xx
  E2E_OTLP_CANARY_BASIC_PASSWORD: OBLT_AW_E2E_OTLP_BASIC_PASSWORD_DO_NOT_USE_xx
  E2E_OTLP_CANARY_BASIC_DECODED: >-
    e2e-otlp-canary-user:OBLT_AW_E2E_OTLP_BASIC_PASSWORD_DO_NOT_USE_xx
  E2E_OTLP_CANARY_BASIC_CREDENTIAL: >-
    ZTJlLW90bHAtY2FuYXJ5LXVzZXI6T0JMVF9BV19FMkVfT1RMUF9CQVNJQ19QQVNTV09SRF9ET19OT1RfVVNFX3h4
  E2E_OTLP_CANARY_BASIC_HEADERS: >-
    Authorization=Basic ZTJlLW90bHAtY2FuYXJ5LXVzZXI6T0JMVF9BV19FMkVfT1RMUF9CQVNJQ19QQVNTV09SRF9ET19OT1RfVVNFX3h4
  E2E_OTLP_CANARY_PERCENT_HEADERS: >-
    Authorization=ApiKey%20OBLT_AW_E2E_OTLP_CANARY_ID_DO_NOT_USE%3AOBLT_AW_E2E_OTLP_CANARY_SECRET_DO_NOT_USE_xx
  E2E_OTLP_CANARY_ALL_HEADERS: >-
    Authorization=ApiKey OBLT_AW_E2E_OTLP_CANARY_ID_DO_NOT_USE:OBLT_AW_E2E_OTLP_CANARY_SECRET_DO_NOT_USE_xx,Authorization=Basic ZTJlLW90bHAtY2FuYXJ5LXVzZXI6T0JMVF9BV19FMkVfT1RMUF9CQVNJQ19QQVNTV09SRF9ET19OT1RfVVNFX3h4

jobs:
  agent-artifact-fixture:
    name: Agent artifact fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      # Validate checkout-ref before privileged fixture work (vendor/setup).
      # Matches sibling E2E leaves and the assert job in this workflow.
      - name: Checkout default branch (dispatch guard)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate checkout-ref for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: python3 scripts/aw_e2e_validate_checkout_ref.py

      # Checkout the ref under test so setup tracks `.aw-compiler-version`
      # (same pin the fleet upgrades), verified against actions-lock.json.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Vendor gh-aw-actions/setup from .aw-compiler-version
        id: aw-setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < .aw-compiler-version)"
          if [[ ! "${ver}" =~ ^v[0-9] ]]; then
            echo "::error::Invalid .aw-compiler-version value: ${ver}"
            exit 1
          fi
          # Checked-in immutable pin for this compiler version (actions-lock).
          expected_sha="$(python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          ver = Path(".aw-compiler-version").read_text(encoding="utf-8").strip()
          lock = json.loads(
              Path(".github/aw/actions-lock.json").read_text(encoding="utf-8")
          )
          key = f"github/gh-aw-actions/setup@{ver}"
          entry = (lock.get("entries") or {}).get(key) or {}
          sha = str(entry.get("sha") or "").strip().lower()
          if len(sha) != 40 or any(c not in "0123456789abcdef" for c in sha):
              print(f"::error::Missing/invalid actions-lock SHA for {key}", file=sys.stderr)
              raise SystemExit(1)
          print(sha)
          PY
          )"
          # Resolve tag → immutable commit; must match the checked-in pin.
          obj_type="$(gh api "repos/github/gh-aw-actions/git/ref/tags/${ver}" --jq .object.type)"
          obj_sha="$(gh api "repos/github/gh-aw-actions/git/ref/tags/${ver}" --jq .object.sha)"
          if [[ "${obj_type}" == "tag" ]]; then
            setup_sha="$(gh api "repos/github/gh-aw-actions/git/tags/${obj_sha}" --jq .object.sha)"
          else
            setup_sha="${obj_sha}"
          fi
          setup_sha="$(printf '%s' "${setup_sha}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${setup_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a 40-hex setup SHA for ${ver}"
            exit 1
          fi
          if [[ "${setup_sha}" != "${expected_sha}" ]]; then
            echo "::error::Tag ${ver} resolved to ${setup_sha}, actions-lock expects ${expected_sha}"
            exit 1
          fi
          # Local uses: path (actionlint-safe); tracks .aw-compiler-version.
          vendor_root=".e2e-vendor/gh-aw-actions"
          rm -rf "${vendor_root}"
          mkdir -p "${vendor_root}"
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/github/gh-aw-actions.git" "${vendor_root}"
          git -C "${vendor_root}" fetch --depth 1 origin "${setup_sha}"
          git -C "${vendor_root}" checkout --detach "${setup_sha}"
          git -C "${vendor_root}" sparse-checkout set setup
          test -f "${vendor_root}/setup/action.yml"
          {
            echo "compiler_version=${ver}"
            echo "setup_ref=${setup_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "Vendored ${vendor_root}/setup@${setup_sha} from .aw-compiler-version=${ver}"

      # Do not set OTEL_* on the job for setup — avoid exporting canary to a
      # real OTLP push from the setup action. Plant/mask/redact steps set it.
      - name: Setup GH-AW action scripts
        uses: ./.e2e-vendor/gh-aw-actions/setup
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: agent-artifact-fixture

      - name: Plant cleartext OTLP canaries in firewall audit tree
        env:
          AUDIT_DIR: /tmp/gh-aw/sandbox/firewall/audit
          # Enabled + disabled endpoints (68811: disabled endpoints still hold creds).
          GH_AW_OTLP_ENDPOINTS: >-
            [{"url":"${{ env.E2E_OTLP_CANARY_ENDPOINT }}","headers":"${{ env.E2E_OTLP_CANARY_HEADERS }}","enabled":true},{"url":"https://e2e-otlp-canary-disabled.invalid.example.oblt-aw:443","headers":"${{ env.E2E_OTLP_CANARY_BASIC_HEADERS }}","enabled":false}]
        run: |
          set -euo pipefail
          mkdir -p "${AUDIT_DIR}"
          # H1-shaped env dump under firewall audit.
          {
            echo "# ${E2E_AUDIT_MARKER}"
            echo "services:"
            echo "  agent:"
            echo "    environment:"
            echo "      OTEL_EXPORTER_OTLP_ENDPOINT: \"${E2E_OTLP_CANARY_ENDPOINT}\""
            echo "      OTEL_EXPORTER_OTLP_HEADERS: \"${E2E_OTLP_CANARY_HEADERS}\""
            echo "      GH_AW_OTLP_ALL_HEADERS: \"${E2E_OTLP_CANARY_ALL_HEADERS}\""
            echo "      GH_AW_OTLP_ENDPOINTS: '${GH_AW_OTLP_ENDPOINTS}'"
          } > "${AUDIT_DIR}/docker-compose.redacted.yml"
          # Extra 68811 shapes: Basic decoded/password, percent-encoded, JSON-escaped.
          # Heredoc avoids broken escapes inside single-quoted python -c.
          json_escaped_password="$(
            python3 - <<'PY'
          import json
          import os

          print(json.dumps(os.environ["E2E_OTLP_CANARY_BASIC_PASSWORD"])[1:-1])
          PY
          )"
          {
            echo "{"
            echo "  \"marker\": \"${E2E_AUDIT_MARKER}\","
            echo "  \"basic_headers\": \"${E2E_OTLP_CANARY_BASIC_HEADERS}\","
            echo "  \"basic_credential\": \"${E2E_OTLP_CANARY_BASIC_CREDENTIAL}\","
            echo "  \"basic_decoded\": \"${E2E_OTLP_CANARY_BASIC_DECODED}\","
            echo "  \"basic_password\": \"${E2E_OTLP_CANARY_BASIC_PASSWORD}\","
            echo "  \"percent_headers\": \"${E2E_OTLP_CANARY_PERCENT_HEADERS}\","
            echo "  \"json_escaped_password\": \"${json_escaped_password}\""
            echo "}"
          } > "${AUDIT_DIR}/otlp-credential-variants.json"
          grep -F "${E2E_OTLP_CANARY_HEADERS}" "${AUDIT_DIR}/docker-compose.redacted.yml"
          grep -F "${E2E_OTLP_CANARY_BASIC_PASSWORD}" "${AUDIT_DIR}/otlp-credential-variants.json"
          grep -F "${E2E_AUDIT_MARKER}" "${AUDIT_DIR}/docker-compose.redacted.yml"

      - name: Mask OTLP telemetry headers
        env:
          OTEL_EXPORTER_OTLP_HEADERS: ${{ env.E2E_OTLP_CANARY_HEADERS }}
          GH_AW_OTLP_ALL_HEADERS: ${{ env.E2E_OTLP_CANARY_ALL_HEADERS }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"

      - name: Redact secrets in artifact files
        id: redact_secrets
        uses: actions/github-script@v9
        env:
          # OTEL / multi-endpoint surface for getOTLPSecretValues() (68811).
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ env.E2E_OTLP_CANARY_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ env.E2E_OTLP_CANARY_HEADERS }}
          GH_AW_DEFAULT_OTLP_ENDPOINT: ${{ env.E2E_OTLP_CANARY_ENDPOINT }}
          GH_AW_DEFAULT_OTLP_HEADERS: ${{ env.E2E_OTLP_CANARY_HEADERS }}
          GH_AW_OTLP_ALL_HEADERS: ${{ env.E2E_OTLP_CANARY_ALL_HEADERS }}
          GH_AW_OTLP_ENDPOINTS: >-
            [{"url":"${{ env.E2E_OTLP_CANARY_ENDPOINT }}","headers":"${{ env.E2E_OTLP_CANARY_HEADERS }}","enabled":true},{"url":"https://e2e-otlp-canary-disabled.invalid.example.oblt-aw:443","headers":"${{ env.E2E_OTLP_CANARY_BASIC_HEADERS }}","enabled":false}]
          # Match compiled agent jobs: GitHub tokens listed; OTLP still comes
          # from getOTLPSecretValues() / add-mask collection in redact_secrets.
          GH_AW_SECRET_NAMES: GH_AW_GITHUB_MCP_SERVER_TOKEN,GH_AW_GITHUB_TOKEN,GITHUB_TOKEN
          SECRET_GH_AW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'redact_secrets.cjs'));
            await main();

      - name: Upload agent-like audit artifact
        if: always() && steps.redact_secrets.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.E2E_ARTIFACT_NAME }}
          path: /tmp/gh-aw/sandbox/firewall/audit/
          if-no-files-found: error
          retention-days: 1

  assert-no-secret-in-artifact:
    name: Assert no secret in agent artifact
    needs: [agent-artifact-fixture]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      # Canary values inherit from workflow-level env (E2E_OTLP_CANARY_*).
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout default branch (dispatch guard)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate checkout-ref for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: python3 scripts/aw_e2e_validate_checkout_ref.py

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Download agent artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.E2E_ARTIFACT_NAME }}
          path: /tmp/e2e-secret-leak-agent-artifact

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install Python dependencies
        run: pip install -r requirements-runtime.txt

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          digest_file="testdata/agentic/secret-leak-artifacts/gitleaks_${GITLEAKS_VERSION}_linux_x64.sha256"
          expected_digest="$(tr -d '[:space:]' < "${digest_file}")"
          if [[ ! "${expected_digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid checked-in gitleaks digest in ${digest_file}"
            exit 1
          fi
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          actual_digest="$(sha256sum "/tmp/${archive}" | awk '{print $1}')"
          if [[ "${actual_digest}" != "${expected_digest}" ]]; then
            echo "::error::gitleaks archive SHA-256 mismatch (got ${actual_digest}, expected ${expected_digest})"
            exit 1
          fi
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Prepare artifact directory
        run: mkdir -p "artifacts/e2e/secret-leak-artifacts/${CASE_ID}"

      - name: Run harness
        id: harness
        continue-on-error: true
        run: |
          set +e
          python3 scripts/obs/e2e/secret_leak_artifacts_e2e_harness.py \
            --case-id "${CASE_ID}" \
            --run-url "${RUN_URL}" \
            --artifact-dir /tmp/e2e-secret-leak-agent-artifact \
            --outcome-path "artifacts/e2e/secret-leak-artifacts/${CASE_ID}/outcome.json" \
            --gitleaks-bin gitleaks \
            --gitleaks-config testdata/agentic/secret-leak-artifacts/gitleaks.toml \
            --gitleaks-report-path "artifacts/e2e/secret-leak-artifacts/${CASE_ID}/gitleaks-report.json"
          echo "harness_exit=$?" >> "${GITHUB_OUTPUT}"

      - name: Run structured oracle
        id: oracle
        run: |
          set -euo pipefail
          python3 scripts/obs/e2e/oracle_secret_leak_artifacts_e2e.py \
            --outcome-path "artifacts/e2e/secret-leak-artifacts/${CASE_ID}/outcome.json" \
            --report-path "artifacts/e2e/secret-leak-artifacts/${CASE_ID}/oracle-report.json" \
            --summary-path "artifacts/e2e/secret-leak-artifacts/${CASE_ID}/summary.json" \
            --testdata-root testdata/agentic/secret-leak-artifacts \
            --expected-case-id "${CASE_ID}"

      - name: Print E2E failure summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          out_dir = Path(f"artifacts/e2e/secret-leak-artifacts/{case_id}")
          summary_path = out_dir / "summary.json"
          outcome_path = out_dir / "outcome.json"
          if not summary_path.is_file() and not outcome_path.is_file():
              print(f"No E2E artifacts under {out_dir}; nothing to summarize.")
              raise SystemExit(0)

          summary = {}
          if summary_path.is_file():
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
          outcome = {}
          if outcome_path.is_file():
              outcome = json.loads(outcome_path.read_text(encoding="utf-8"))

          passed = summary.get("pass")
          if passed is True:
              print(f"E2E case {case_id}: pass=true")
              raise SystemExit(0)

          print(f"E2E case {case_id}: pass={passed!r}")
          detail = (
              summary.get("failure_detail")
              or summary.get("block_reason")
              or outcome.get("block_reason")
              or "(no failure_detail/block_reason in artifacts)"
          )
          print("Failure detail:")
          print(detail)
          failed = summary.get("failed_checks") or []
          if failed:
              print("Failed checks:")
              for item in failed:
                  print(f"  - [{item.get('id')}] {item.get('detail')}")
          first = str(detail).splitlines()[0]
          print(f"::error::E2E {case_id}: {first}")
          PY

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-secret-leak-artifacts-${{ env.CASE_ID }}-${{ github.run_id }}
          path: artifacts/e2e/secret-leak-artifacts/${{ env.CASE_ID }}/
          if-no-files-found: warn
          retention-days: 30
