name: Security Agentic Workflow — Issue Comment Event

# Event-scoped orchestrator: Control Plane dashboard deactivation-reason only
# until Security registers routes. No aw-prelude (requires non-empty route list).
on:
  workflow_call:
permissions:
  contents: read

jobs:
  dashboard-audit-reason:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/dashboard') &&
      !contains(github.event.comment.body, 'aw:dashboard-audit')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/aw-dashboard-audit.yml
    with:
      mode: record-reason
