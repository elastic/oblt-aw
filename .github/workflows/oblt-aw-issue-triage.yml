---
name: Issue Triage
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-event-context.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:

  issue-triage:
    permissions:
      actions: read
      contents: read
      discussions: write
      issues: write
      pull-requests: write
    if: >-
      inputs.shared-proceed == 'true' &&
      github.event_name == 'issues' &&
      github.event.action == 'opened'
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-issue-triage.lock.yml@main
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
