name: Docs Agentic Workflow — Issue Comment Event

# Event-scoped orchestrator: one shared prelude chain for issue_comment routes.
on:
  workflow_call:
permissions:
  contents: read

jobs:
  # Menus need prelude; dashboard-audit-reason does not. Skip prelude on
  # issue_comment.created so reason recording does not pay for a dashboard read.
  run-aw-prelude:
    if: github.event.action == 'edited'
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/aw-prelude.yml
    with:
      control-plane-workflows: >-
        ["docs-aw-ai-menu.yml","docs-aw-pr-ai-menu.yml"]
      load-allowed-authors: false

  dashboard-audit-reason:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      contains(join(github.event.issue.labels.*.name, ','), 'oblt-aw/dashboard') &&
      !contains(github.event.comment.body, 'aw:dashboard-audit')
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/aw-dashboard-audit.yml
    with:
      mode: record-reason

  ai-menu:
    needs: run-aw-prelude
    if: >-
      fromJSON(needs.run-aw-prelude.outputs.proceed-by-workflow)['docs-aw-ai-menu.yml'] == 'true' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'edited' &&
      github.event.issue.pull_request == null
    permissions:
      actions: read
      contents: read
      copilot-requests: write
      discussions: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/docs-aw-ai-menu.yml
    with:
      shared-proceed: ${{ fromJSON(needs.run-aw-prelude.outputs.proceed-by-workflow)['docs-aw-ai-menu.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.run-aw-prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.run-aw-prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.run-aw-prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.run-aw-prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.run-aw-prelude.outputs.token-policy }}
  pr-ai-menu:
    needs: run-aw-prelude
    if: >-
      fromJSON(needs.run-aw-prelude.outputs.proceed-by-workflow)['docs-aw-pr-ai-menu.yml'] == 'true' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'edited' &&
      github.event.issue.pull_request != null
    permissions:
      actions: read
      checks: read
      contents: read
      copilot-requests: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/docs-aw-pr-ai-menu.yml
    with:
      shared-proceed: ${{ fromJSON(needs.run-aw-prelude.outputs.proceed-by-workflow)['docs-aw-pr-ai-menu.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.run-aw-prelude.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.run-aw-prelude.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.run-aw-prelude.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.run-aw-prelude.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.run-aw-prelude.outputs.token-policy }}
