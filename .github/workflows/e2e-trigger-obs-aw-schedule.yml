name: E2E — Trigger Observability schedule routes

# Control-plane only (not distributed via remote-workflow-template).
# Live autodoc E2E dispatches this entry so production
# trigger-obs-aw-schedule-daily.yml (client template) stays free of E2E inputs.
run-name: >-
  E2E schedule${{
    github.event.inputs.e2e-invocation-id != ''
    && format(' [{0}]', github.event.inputs.e2e-invocation-id)
    || ''
  }}
on:
  workflow_dispatch:
    inputs:
      e2e-autodoc-mode:
        description: >-
          When true, obs:autodoc evaluates only the checked-in E2E bait
          markdown (docs/testing/fixtures/e2e-autodoc-bait.md).
        required: false
        type: boolean
        default: true
      e2e-repo-scheduled-mode:
        description: >-
          When true, obs:repo-scheduled runs the checked-in E2E bait
          automation under .github/ai/scheduled/e2e-repo-scheduled-bait.md.
        required: false
        type: boolean
        default: false
      e2e-invocation-id:
        description: >-
          Optional correlation token for live E2E run selection and issue bodies.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run-obs-aw-schedule:
    name: Run schedule event orchestrator
    permissions:
      actions: read
      contents: write
      copilot-requests: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/obs-aw-event-schedule.yml
    with:
      schedule-profile: daily
      # workflow_dispatch booleans arrive as strings in github.event.inputs.
      e2e-autodoc-mode: ${{ github.event.inputs.e2e-autodoc-mode == 'true' }}
      e2e-repo-scheduled-mode: ${{ github.event.inputs.e2e-repo-scheduled-mode == 'true' }}
      e2e-invocation-id: ${{ github.event.inputs.e2e-invocation-id }}
    secrets:
      # Same mapping as distributed trigger-obs-aw-schedule-*.yml. Optional for
      # E2E bait (Buildkite MCP is required:false); needed when automations use
      # buildkite-logs on the control plane.
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_LOGS_API_TOKEN }}
