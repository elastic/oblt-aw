name: Observability Agentic Workflow — Workflow Run

on:
  workflow_run:
    types: [completed]

permissions:
  contents: read

jobs:
  run-oblt-aw-workflow-run:
    if: github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: read
      contents: read
      copilot-requests: write
      id-token: write
      issues: read
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/oblt-aw-event-workflow-run.yml@main # ratchet:exclude
