---
name: E2E — Repo scheduled bait issue

# Manual production E2E for obs:repo-scheduled against elastic/oblt-aw.
# Verifies the checked-in E2E bait instruction, dispatches
# e2e-trigger-obs-aw-schedule.yml with e2e-repo-scheduled-mode=true so the
# agent creates a marker issue, then closes that issue (bait stays on the
# default branch). Not part of the default PR required gate in ci.yml.
# Production trigger-obs-aw-schedule-*.yml clients stay E2E-free.
on:
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: Git ref or full SHA to checkout (default main tip)
        required: false
        type: string
        default: main
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref or full SHA to checkout (default main tip)
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: e2e-repo-scheduled
  cancel-in-progress: false

jobs:
  e2e:
    name: Repo scheduled E2E (${{ matrix.case_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # Serialize so no-op's unscoped bait-issue scan cannot race issue-live.
      max-parallel: 1
      matrix:
        case_id:
          - schedule-issue-live
          - schedule-noop-live
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      CASE_ID: ${{ matrix.case_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout default branch (dispatch guard)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate checkout-ref for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKOUT_REF: ${{ inputs.checkout-ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: python3 scripts/aw_e2e_validate_checkout_ref.py

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install Python dependencies
        run: pip install -r requirements-runtime.txt

      - name: Prepare artifact directory
        run: mkdir -p "artifacts/e2e/repo-scheduled/${CASE_ID}"

      - name: Run harness
        id: harness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/obs/e2e/repo_scheduled_e2e_harness.py \
            --case-id "${CASE_ID}" \
            --run-url "${RUN_URL}" \
            --outcome-path "artifacts/e2e/repo-scheduled/${CASE_ID}/outcome.json"
          echo "harness_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Run structured oracle
        id: oracle
        run: |
          set -euo pipefail
          python3 scripts/obs/e2e/oracle_repo_scheduled_e2e.py \
            --outcome-path "artifacts/e2e/repo-scheduled/${CASE_ID}/outcome.json" \
            --report-path "artifacts/e2e/repo-scheduled/${CASE_ID}/oracle-report.json" \
            --summary-path "artifacts/e2e/repo-scheduled/${CASE_ID}/summary.json" \
            --testdata-root testdata/agentic/repo-scheduled \
            --expected-case-id "${CASE_ID}"

      - name: Print E2E failure summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          out_dir = Path(f"artifacts/e2e/repo-scheduled/{case_id}")
          summary_path = out_dir / "summary.json"
          outcome_path = out_dir / "outcome.json"
          if not summary_path.is_file() and not outcome_path.is_file():
              print(f"No E2E artifacts under {out_dir}; nothing to summarize.")
              raise SystemExit(0)

          summary = {}
          if summary_path.is_file():
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
          outcome = {}
          if outcome_path.is_file():
              outcome = json.loads(outcome_path.read_text(encoding="utf-8"))

          passed = summary.get("pass")
          if passed is True:
              print(f"E2E case {case_id}: pass=true")
              raise SystemExit(0)

          print(f"E2E case {case_id}: pass={passed!r}")
          detail = (
              summary.get("failure_detail")
              or summary.get("block_reason")
              or outcome.get("block_reason")
              or "(no failure_detail/block_reason in artifacts)"
          )
          print("Failure detail:")
          print(detail)
          failed = summary.get("failed_checks") or []
          if failed:
              print("Failed checks:")
              for item in failed:
                  print(f"  - [{item.get('id')}] {item.get('detail')}")
          issue = outcome.get("issue") or {}
          if isinstance(issue, dict) and issue.get("url"):
              print(f"Issue: {issue.get('url')}")
          first = str(detail).splitlines()[0]
          print(f"::error::E2E {case_id}: {first}")
          PY

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-repo-scheduled-${{ env.CASE_ID }}-${{ github.run_id }}
          path: artifacts/e2e/repo-scheduled/${{ env.CASE_ID }}/
          if-no-files-found: warn
          retention-days: 30
