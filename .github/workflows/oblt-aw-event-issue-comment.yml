name: Observability Agentic Workflow — Issue Comment Event

# Event-scoped orchestrator: one shared prelude chain for all issue_comment routes.
on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  event-context:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/aw-event-context.yml
    with:
      control-plane-workflows: >-
        ["oblt-aw-issue-fixer.yml","oblt-aw-mention-in-issue.yml"]
      load-allowed-authors: false

  issue-fixer:
    needs: event-context
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-issue-fixer.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-issue-fixer.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets: inherit

  mention-in-issue:
    needs: event-context
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-mention-in-issue.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-mention-in-issue.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
