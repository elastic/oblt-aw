---
name: E2E — ESTC PR Buildkite Detective

# Production E2E for obs:estc-pr-buildkite-detective against elastic/oblt-aw
# (intentional production consumer for this slice; no separate sandbox — see #1911 docs).
# Live happy path only: Buildkite publishes commit status → trigger → agent.
# Also callable from the future release/promote train (#1878).
# Not part of the default PR required gate in ci.yml.
# Path-filtered pull_request runs target the PR under review (head/base).
# Manual / workflow_call runs use the long-lived fixture PR.
# Lock/wrapper still pin @main (smoke path); candidate-pin is a separate follow-up.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/gh-aw-estc-pr-buildkite-detective.md
      - .github/workflows/gh-aw-estc-pr-buildkite-detective.lock.yml
      - .github/workflows/obs-aw-estc-pr-buildkite-detective.yml
      - .github/workflows/gh-aw-fragments/**
      - .github/workflows/e2e-estc-pr-buildkite-detective.yml
      - .github/remote-workflow-template/obs/.github/workflows/trigger-obs-aw-status.yml
      - scripts/estc_pr_buildkite_detective_e2e_harness.py
      - scripts/oracle_estc_pr_buildkite_detective_e2e.py
      - config/obs/e2e-estc-pr-buildkite-detective.json
      - testdata/agentic/estc-pr-buildkite-detective/**
      - tests/e2e/test_estc_pr_buildkite_detective_e2e.py
      - .buildkite/pipeline.e2e-estc-fail.yml
  workflow_dispatch:
    inputs:
      case-id:
        description: Case id, or "all" for the live matrix
        required: true
        type: string
        default: all
  workflow_call:
    inputs:
      case-id:
        description: Case id, or "all" for the live matrix
        required: false
        type: string
        default: all
    secrets:
      BUILDKITE_TOKEN:
        description: Buildkite token (write_builds + read) for intentional-failure creates
        required: false
    outputs:
      pass:
        description: Whether all matrix legs passed (summary.pass)
        value: ${{ jobs.e2e-result.outputs.pass }}

permissions:
  contents: read

concurrency:
  # One live matrix per PR; shared group for dispatch / workflow_call (fixture PR).
  group: e2e-estc-pr-buildkite-detective-${{ github.event.pull_request.number || 'shared' }}
  cancel-in-progress: false

jobs:
  e2e-matrix:
    name: Resolve E2E matrix
    # Fork PRs lack secrets and cannot target same-repo heads safely.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.resolve.outputs.cases }}
    steps:
      - name: Resolve cases
        id: resolve
        env:
          INPUT_CASE_ID: ${{ inputs.case-id }}
        run: |
          set -euo pipefail
          CASE_ID="${INPUT_CASE_ID:-all}"
          if [ "${CASE_ID}" = "all" ]; then
            CASES='["status-failure-open-pr-live"]'
          else
            CASES="$(printf '%s' "[\"${CASE_ID}\"]")"
          fi
          echo "cases=${CASES}" >> "$GITHUB_OUTPUT"

  e2e:
    name: ESTC detective E2E (${{ matrix.case-id }})
    needs: e2e-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Shared fixture PR / status context — never run legs in parallel.
      max-parallel: 1
      matrix:
        case-id: ${{ fromJSON(needs.e2e-matrix.outputs.cases) }}
    permissions:
      contents: write
      pull-requests: write
      # Observe Buildkite-published commit statuses (harness polls statuses API).
      statuses: read
      actions: read
      # Label create for first-time fixture PR provisioning.
      issues: write
      checks: read
    env:
      CASE_ID: ${{ matrix.case-id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
      E2E_BUILDKITE_ORG: ${{ vars.E2E_BUILDKITE_ORG }}
      E2E_BUILDKITE_PIPELINE: ${{ vars.E2E_BUILDKITE_PIPELINE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Prepare artifact directory
        run: mkdir -p "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}"

      - name: Run harness
        id: harness
        continue-on-error: true
        env:
          TARGET_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          TARGET_HEAD_BRANCH: ${{ github.head_ref || '' }}
          TARGET_BASE_BRANCH: ${{ github.base_ref || '' }}
        run: |
          set +e
          EXTRA_ARGS=()
          if [ -n "${TARGET_PR_NUMBER}" ]; then
            EXTRA_ARGS+=(--pr-number "${TARGET_PR_NUMBER}")
            EXTRA_ARGS+=(--head-branch "${TARGET_HEAD_BRANCH}")
            EXTRA_ARGS+=(--base-branch "${TARGET_BASE_BRANCH}")
          fi
          python3 scripts/estc_pr_buildkite_detective_e2e_harness.py \
            --case-id "${CASE_ID}" \
            --run-url "${RUN_URL}" \
            --outcome-path "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}/outcome.json" \
            "${EXTRA_ARGS[@]}"
          echo "harness_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Run structured oracle
        id: oracle
        run: |
          set -euo pipefail
          python3 scripts/oracle_estc_pr_buildkite_detective_e2e.py \
            --outcome-path "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}/outcome.json" \
            --report-path "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}/oracle-report.json" \
            --summary-path "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}/summary.json" \
            --quarantine-path config/obs/e2e-quarantine.json \
            --testdata-root testdata/agentic/estc-pr-buildkite-detective \
            --expected-case-id "${CASE_ID}"

      - name: Print E2E failure summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          out_dir = Path(f"artifacts/e2e/estc-pr-buildkite-detective/{case_id}")
          summary_path = out_dir / "summary.json"
          outcome_path = out_dir / "outcome.json"
          if not summary_path.is_file() and not outcome_path.is_file():
              print(f"No E2E artifacts under {out_dir}; nothing to summarize.")
              raise SystemExit(0)

          summary = {}
          if summary_path.is_file():
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
          outcome = {}
          if outcome_path.is_file():
              outcome = json.loads(outcome_path.read_text(encoding="utf-8"))

          passed = summary.get("pass")
          if passed is True:
              print(f"E2E case {case_id}: pass=true")
              raise SystemExit(0)

          print(f"E2E case {case_id}: pass={passed!r}")
          detail = (
              summary.get("failure_detail")
              or summary.get("block_reason")
              or outcome.get("block_reason")
              or "(no failure_detail/block_reason in artifacts)"
          )
          print("Failure detail:")
          print(detail)
          failed = summary.get("failed_checks") or []
          if failed:
              print("Failed checks:")
              for item in failed:
                  print(f"  - [{item.get('id')}] {item.get('detail')}")
          bk = outcome.get("buildkite") or {}
          if isinstance(bk, dict) and bk.get("web_url"):
              print(f"Buildkite: {bk.get('web_url')} state={bk.get('state')!r}")
          if outcome.get("commit_sha"):
              print(f"Commit: {outcome.get('commit_sha')}")
          first = str(detail).splitlines()[0]
          print(f"::error::E2E {case_id}: {first}")
          PY

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-estc-pr-buildkite-detective-${{ matrix.case-id }}-${{ github.run_id }}
          path: artifacts/e2e/estc-pr-buildkite-detective/${{ matrix.case-id }}/
          if-no-files-found: warn
          retention-days: 30

  e2e-result:
    name: E2E result gate
    needs: [e2e-matrix, e2e]
    if: always() && needs.e2e-matrix.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pass: ${{ steps.gate.outputs.pass }}
    steps:
      - name: Aggregate matrix result
        id: gate
        run: |
          set -euo pipefail
          # needs.e2e.result is success only when every matrix leg succeeded.
          if [ "${{ needs.e2e.result }}" = "success" ]; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
