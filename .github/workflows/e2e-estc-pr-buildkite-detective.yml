---
name: E2E — ESTC PR Buildkite Detective

# Production E2E for obs:estc-pr-buildkite-detective against elastic/oblt-aw
# (intentional production consumer for this slice; no separate sandbox — see #1911 docs).
# Live happy path: Buildkite publishes commit status → trigger → agent.
# Negative cases: harness-posted statuses need secrets.E2E_GH_TOKEN (github.token cannot trigger).
# Also callable from the future release/promote train (#1878).
# Not part of the default PR required gate in ci.yml.
on:
  workflow_dispatch:
    inputs:
      case-id:
        description: Case id, or "all" for the live matrix
        required: true
        type: string
        default: all
  schedule:
    # Weekly production smoke (paid agent on happy-path case).
    - cron: "17 6 * * 1"
  workflow_call:
    inputs:
      case-id:
        description: Case id, or "all" for the live matrix
        required: false
        type: string
        default: all
    secrets:
      BUILDKITE_TOKEN:
        description: Buildkite token (write_builds + read) for intentional-failure creates
        required: false
      E2E_GH_TOKEN:
        description: >-
          Optional PAT/App token for harness-posted commit statuses. Required for
          negative live cases so status events can trigger workflows (github.token cannot).
        required: false
    outputs:
      pass:
        description: Whether all matrix legs passed (summary.pass)
        value: ${{ jobs.e2e-result.outputs.pass }}

permissions:
  contents: read

concurrency:
  # Stable group: one live matrix at a time against the shared fixture PR.
  group: e2e-estc-pr-buildkite-detective
  cancel-in-progress: false

jobs:
  e2e-matrix:
    name: Resolve E2E matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.resolve.outputs.cases }}
    steps:
      - name: Resolve cases
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CASE_ID: ${{ inputs.case-id }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "schedule" ]; then
            CASE_ID=all
          else
            CASE_ID="${INPUT_CASE_ID:-all}"
          fi
          if [ "${CASE_ID}" = "all" ]; then
            CASES='["status-failure-open-pr-live","status-success-skipped","status-failure-non-buildkite","status-failure-no-open-pr"]'
          else
            CASES="$(printf '%s' "[\"${CASE_ID}\"]")"
          fi
          echo "cases=${CASES}" >> "$GITHUB_OUTPUT"

  e2e:
    name: ESTC detective E2E (${{ matrix.case-id }})
    needs: e2e-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Shared fixture PR / status context — never run legs in parallel.
      max-parallel: 1
      matrix:
        case-id: ${{ fromJSON(needs.e2e-matrix.outputs.cases) }}
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: read
      # Label create for first-time fixture PR provisioning.
      issues: write
      checks: read
    env:
      CASE_ID: ${{ matrix.case-id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
      E2E_BUILDKITE_ORG: ${{ vars.E2E_BUILDKITE_ORG }}
      E2E_BUILDKITE_PIPELINE: ${{ vars.E2E_BUILDKITE_PIPELINE }}
      # Optional escape hatch: skip create and reuse a fixed failed build URL.
      E2E_ESTC_BUILDKITE_TARGET_URL: ${{ vars.E2E_ESTC_BUILDKITE_TARGET_URL }}
      # Prefer E2E_GH_TOKEN so harness-posted statuses can trigger workflows.
      GH_TOKEN: ${{ secrets.E2E_GH_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Prepare artifact directory
        run: mkdir -p "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}"

      - name: Run harness
        id: harness
        continue-on-error: true
        run: |
          set +e
          python3 scripts/estc_pr_buildkite_detective_e2e_harness.py \
            --case-id "${CASE_ID}" \
            --run-url "${RUN_URL}" \
            --outcome-path "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}/outcome.json"
          echo "harness_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Run structured oracle
        id: oracle
        run: |
          set -euo pipefail
          python3 scripts/oracle_estc_pr_buildkite_detective_e2e.py \
            --outcome-path "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}/outcome.json" \
            --report-path "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}/oracle-report.json" \
            --summary-path "artifacts/e2e/estc-pr-buildkite-detective/${CASE_ID}/summary.json" \
            --quarantine-path config/obs/e2e-quarantine.json \
            --testdata-root testdata/agentic/estc-pr-buildkite-detective \
            --expected-case-id "${CASE_ID}"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-estc-pr-buildkite-detective-${{ matrix.case-id }}-${{ github.run_id }}
          path: artifacts/e2e/estc-pr-buildkite-detective/${{ matrix.case-id }}/
          if-no-files-found: warn
          retention-days: 30

  e2e-result:
    name: E2E result gate
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pass: ${{ steps.gate.outputs.pass }}
    steps:
      - name: Aggregate matrix result
        id: gate
        run: |
          set -euo pipefail
          # needs.e2e.result is success only when every matrix leg succeeded.
          if [ "${{ needs.e2e.result }}" = "success" ]; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
