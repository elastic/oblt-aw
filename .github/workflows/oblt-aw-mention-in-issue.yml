---
name: Mention in Issue
on:
  workflow_call:
    inputs:
      ingress-event-name:
        description: Relayed event name from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-action:
        description: Relayed event action from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-event-payload-json:
        description: Relayed github.event JSON from oblt-aw-ingress
        required: false
        type: string
        default: ''
      ingress-allowed-pr-authors-csv:
        description: Allowed PR bot logins from oblt-aw-ingress prelude
        required: false
        type: string
        default: ''
      ingress-allowed-issue-authors-csv:
        description: Allowed issue bot logins from oblt-aw-ingress prelude
        required: false
        type: string
        default: ''
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:

  resolve-apm-assets:
    uses: ./.github/workflows/aw-resolve-apm-assets.yml
    with:
      control-plane-workflow: oblt-aw-mention-in-issue.yml

  mention-in-issue:
    needs: [resolve-apm-assets]
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/ai') &&
      !startsWith(github.event.comment.body, '/ai implement') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-mention-in-issue.lock.yml@main
    with:
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
