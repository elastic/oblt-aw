---
name: Mention in Issue
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-event-context.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:

  mention-in-issue:
    permissions:
      actions: read
      contents: write
      discussions: write
      issues: write
      pull-requests: write
    if: >-
      inputs.shared-proceed == 'true' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/ai') &&
      !startsWith(github.event.comment.body, '/ai implement') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-mention-in-issue.lock.yml@main
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
