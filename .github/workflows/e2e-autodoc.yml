---
name: E2E — Autodoc audit + fix

# Manual production E2E for obs:autodoc against elastic/oblt-aw.
# Verifies the checked-in intentional undocumented bait, dispatches
# trigger-obs-aw-schedule.yml with e2e-additional-instructions so docs-patrol
# evaluates that path, waits for audit + issue and create-pr-from-issue fix +
# PR, then closes the issue/PR (bait fixture stays on the default branch).
# Not part of the default PR required gate in ci.yml.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-autodoc
  cancel-in-progress: false

env:
  CASE_ID: schedule-audit-fix-pr-live

jobs:
  e2e:
    name: Autodoc audit+fix E2E
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: write
      actions: write
      issues: write
      checks: read
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install Python dependencies
        run: pip install -r requirements-runtime.txt

      - name: Prepare artifact directory
        run: mkdir -p "artifacts/e2e/autodoc/${CASE_ID}"

      - name: Run harness
        id: harness
        continue-on-error: true
        run: |
          set +e
          python3 scripts/obs/e2e/autodoc_e2e_harness.py \
            --case-id "${CASE_ID}" \
            --run-url "${RUN_URL}" \
            --outcome-path "artifacts/e2e/autodoc/${CASE_ID}/outcome.json"
          echo "harness_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Run structured oracle
        id: oracle
        run: |
          set -euo pipefail
          python3 scripts/obs/e2e/oracle_autodoc_e2e.py \
            --outcome-path "artifacts/e2e/autodoc/${CASE_ID}/outcome.json" \
            --report-path "artifacts/e2e/autodoc/${CASE_ID}/oracle-report.json" \
            --summary-path "artifacts/e2e/autodoc/${CASE_ID}/summary.json" \
            --testdata-root testdata/agentic/autodoc \
            --expected-case-id "${CASE_ID}"

      - name: Print E2E failure summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          case_id = os.environ["CASE_ID"]
          out_dir = Path(f"artifacts/e2e/autodoc/{case_id}")
          summary_path = out_dir / "summary.json"
          outcome_path = out_dir / "outcome.json"
          if not summary_path.is_file() and not outcome_path.is_file():
              print(f"No E2E artifacts under {out_dir}; nothing to summarize.")
              raise SystemExit(0)

          summary = {}
          if summary_path.is_file():
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
          outcome = {}
          if outcome_path.is_file():
              outcome = json.loads(outcome_path.read_text(encoding="utf-8"))

          passed = summary.get("pass")
          if passed is True:
              print(f"E2E case {case_id}: pass=true")
              raise SystemExit(0)

          print(f"E2E case {case_id}: pass={passed!r}")
          detail = (
              summary.get("failure_detail")
              or summary.get("block_reason")
              or outcome.get("block_reason")
              or "(no failure_detail/block_reason in artifacts)"
          )
          print("Failure detail:")
          print(detail)
          failed = summary.get("failed_checks") or []
          if failed:
              print("Failed checks:")
              for item in failed:
                  print(f"  - [{item.get('id')}] {item.get('detail')}")
          issue = outcome.get("audit_issue") or {}
          if isinstance(issue, dict) and issue.get("url"):
              print(f"Issue: {issue.get('url')}")
          fix_pr_url = summary.get("fix_pr_url")
          if not fix_pr_url:
              fix_pr = outcome.get("fix_pr") or {}
              if isinstance(fix_pr, dict):
                  fix_pr_url = fix_pr.get("url")
          if fix_pr_url:
              print(f"Fix PR: {fix_pr_url}")
          first = str(detail).splitlines()[0]
          print(f"::error::E2E {case_id}: {first}")
          PY

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-autodoc-${{ env.CASE_ID }}-${{ github.run_id }}
          path: artifacts/e2e/autodoc/${{ env.CASE_ID }}/
          if-no-files-found: warn
          retention-days: 30
