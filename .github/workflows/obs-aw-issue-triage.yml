---
name: Issue Triage
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-prelude.
        required: true
        type: string
      shared-allowed-pr-authors-json:
        required: true
        type: string
      shared-allowed-pr-authors-csv:
        required: true
        type: string
      shared-allowed-issue-authors-json:
        required: true
        type: string
      shared-allowed-issue-authors-csv:
        required: true
        type: string
      shared-token-policy:
        required: true
        type: string
# Nested GH-AW jobs mint OIDC ephemeral tokens when mint-ephemeral-token is true.
permissions:
  contents: read

jobs:

  resolve-apm-assets:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'opened'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-issue-triage.yml

  issue-triage:
    needs: [resolve-apm-assets]
    permissions:
      actions: read
      contents: read
      discussions: write
      issues: write
      pull-requests: write
      copilot-requests: write
      id-token: write
    uses: elastic/ai-github-actions/.github/workflows/gh-aw-issue-triage.lock.yml@main
    with:
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
      mint-ephemeral-token: true
      token-policy: ${{ inputs.shared-token-policy }}
