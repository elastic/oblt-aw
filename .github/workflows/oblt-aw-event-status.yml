name: Observability Agentic Workflow — Status Event

# Event-scoped orchestrator for status-triggered routes.
on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true
      BUILDKITE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  event-context:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/aw-event-context.yml
    with:
      control-plane-workflows: '["oblt-aw-estc-pr-buildkite-detective.yml"]'
      load-allowed-authors: false

  estc-pr-buildkite-detective:
    needs: event-context
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-estc-pr-buildkite-detective.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-estc-pr-buildkite-detective.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
