---
name: PR Actions Detective
on:
  workflow_call:
    inputs:
      shared-proceed:
        description: Dashboard gate for this route from aw-prelude.
        required: true
        type: string

permissions:
  contents: read

jobs:

  resolve-apm-assets:
    if: inputs.shared-proceed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/aw-resolve-agentic-assets.yml
    with:
      workflow-basename: obs-aw-pr-actions-detective.yml

  pr-actions-detective:
    if: inputs.shared-proceed == 'true'
    needs: [resolve-apm-assets]
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: elastic/oblt-aw/.github/workflows/gh-aw-pr-actions-detective.lock.yml@main
    with:
      additional-instructions: ${{ needs.resolve-apm-assets.outputs.resolved-additional-instructions }}
      # fromJSON('"\n"') yields a real newline; '\n' is two literal characters in GHA expressions.
      setup-commands: ${{ join(fromJSON(needs.resolve-apm-assets.outputs.resolved-setup-commands-json), fromJSON('"\n"')) }}
