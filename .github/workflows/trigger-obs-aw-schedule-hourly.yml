name: Observability Agentic Workflow — Schedule (hourly)

# In-repo mirror of the distributed client template.
# Second cron only: calls obs-aw-event-schedule.yml with schedule-profile=hourly.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-obs-aw-schedule-hourly:
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/obs-aw-event-schedule.yml@main # ratchet:exclude
    with:
      schedule-profile: hourly
