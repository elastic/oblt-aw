name: Observability Agentic Workflow — Pull Request Event

# Event-scoped orchestrator: one shared prelude chain for all pull_request routes.
on:
  workflow_call:
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  event-context:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/aw-event-context.yml
    with:
      control-plane-workflows: >-
        ["oblt-aw-automerge.yml","oblt-aw-dependency-review.yml"]
      load-allowed-authors: true

  automerge:
    needs: event-context
    permissions:
      actions: read
      contents: write
      discussions: write
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-automerge.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-automerge.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  dependency-review:
    needs: event-context
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/oblt-aw-dependency-review.yml
    with:
      shared-proceed: ${{ fromJSON(needs.event-context.outputs.proceed-by-workflow)['oblt-aw-dependency-review.yml'] }}
      shared-allowed-pr-authors-json: ${{ needs.event-context.outputs.allowed-pr-authors-json }}
      shared-allowed-pr-authors-csv: ${{ needs.event-context.outputs.allowed-pr-authors-csv }}
      shared-allowed-issue-authors-json: ${{ needs.event-context.outputs.allowed-issue-authors-json }}
      shared-allowed-issue-authors-csv: ${{ needs.event-context.outputs.allowed-issue-authors-csv }}
      shared-token-policy: ${{ needs.event-context.outputs.token-policy }}
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
