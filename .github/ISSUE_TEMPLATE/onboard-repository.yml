name: Onboard a repository
description: Register an elastic/* repository for OBLT Agentic Workflows (oblt-aw)
title: "[onboard] elastic/<repo>"
labels:
  - "oblt-aw/onboard/repository"
body:
  - type: markdown
    attributes:
      value: |
        Use this form to register an `elastic/*` repository for OBLT Agentic Workflows.

        Fill in the fields below and submit. Automation opens the required pull requests and comments on this issue with status, any errors, and what to do next.

        Guide: [Onboard a repository](https://github.com/elastic/oblt-aw/blob/main/docs/guides/user/onboard-a-repository.md)
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Full GitHub name under the elastic organization (`elastic/<repo>`).
      placeholder: elastic/my-repo
    validations:
      required: true
  - type: dropdown
    id: org-key
    attributes:
      label: Organization key
      description: Which organization key in elastic/oblt-aw (`config/<org-key>/`) this repository joins.
      options:
        - obs
        - docs
    validations:
      required: true
