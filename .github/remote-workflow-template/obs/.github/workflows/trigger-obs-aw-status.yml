name: Observability Agentic Workflow — Status

on:
  status:

permissions:
  contents: read

jobs:
  run-obs-aw-status:
    if: >-
      contains(github.event.context, 'buildkite') &&
      (github.event.state == 'failure' || github.event.state == 'success')
    permissions:
      actions: read
      contents: write
      copilot-requests: write
      id-token: write
      issues: write
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/obs-aw-event-status.yml@main # ratchet:exclude
    secrets:
      BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_LOGS_API_TOKEN }}
