name: Observability Agentic Workflow — Security Detector

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-aw:
    permissions:
      actions: write
      checks: read
      contents: write
      discussions: write
      id-token: write
      issues: write
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/oblt-aw-security-detector.yml@main # ratchet:exclude
