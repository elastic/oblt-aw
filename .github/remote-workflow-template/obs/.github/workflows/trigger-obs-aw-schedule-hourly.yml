name: Observability Agentic Workflow — Schedule (hourly)

# Second cron only: GitHub does not expose which cron fired on a single workflow.
# Calls the same obs-aw-event-schedule.yml with schedule-profile=hourly.
# Cron is every 30 minutes so armed automerge (and future hourly-profile routes)
# wake often enough without running daily autodoc/security on that cadence.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-obs-aw-schedule-hourly:
    permissions:
      actions: read
      contents: write
      id-token: write
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/obs-aw-event-schedule.yml@main # ratchet:exclude
    with:
      schedule-profile: hourly
