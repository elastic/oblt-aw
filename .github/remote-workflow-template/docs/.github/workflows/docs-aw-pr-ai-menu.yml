name: Docs Agentic Workflow — AI PR Menu

# Distributed to repositories in config/docs/active-repositories.json.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [edited]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number for Docs PR AI menu (manual refresh).
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-aw:
    permissions:
      actions: read
      checks: read
      contents: read
      discussions: write
      id-token: write
      issues: write
      pull-requests: write
    uses: elastic/oblt-aw/.github/workflows/docs-aw-pr-ai-menu.yml@main # ratchet:exclude
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
